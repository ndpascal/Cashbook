<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1664C0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Cashbook">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<title>Household Cashbook</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Familjen+Grotesk:wght@500;600;700&family=Hanken+Grotesk:wght@400;500;600;700&family=Spline+Sans+Mono:wght@400;500;600&display=swap">
<style>
[hidden] { display: none !important; }
html { color-scheme: light; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
body { margin: 0; }
:root {
  /* Layout: one ledger column (max 880px). Tabs act as an index row, the month opens with a dotted-leader statement, lists are ruled like a cashbook page. */
  --bg: #EEF2F5;
  --surface: #FFFFFF;
  --ink: #14212B;
  --muted: #586976;
  --rule: #D3DBE2;
  --line: #8B9BA8;
  --accent: #1664C0;
  --accent-ink: #FFFFFF;
  --accent-soft: #E3EEFA;
  --pos: #17724A;
  --warn: #8A5A00;
  --warn-fill: #E0A100;
  --warn-soft: #FBF1D9;
  --neg: #B3362C;
  --neg-soft: #FBE7E4;
  --viz-income: #2a78d6;
  --viz-spend: #eb6834;
  --viz-budget: #1baf7a;
  --viz-pos: #2a78d6;
  --viz-neg: #e34948;
  --viz-axis: #B4BEC7;
  --f-display: 'Familjen Grotesk', 'Helvetica Neue', Arial, sans-serif;
  --f-body: 'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --f-num: 'Spline Sans Mono', ui-monospace, 'SF Mono', Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0E151B; --surface: #15202A; --ink: #E6EDF2; --muted: #9AABB8; --rule: #263644; --line: #587082;
    --accent: #5AA2F0; --accent-ink: #0A1722; --accent-soft: #16304A;
    --pos: #4CC38A; --warn: #F0C04F; --warn-fill: #E3B04B; --warn-soft: #33290F; --neg: #F28B80; --neg-soft: #3A1B19;
    --viz-income: #3987e5; --viz-spend: #d95926; --viz-budget: #199e70; --viz-pos: #3987e5; --viz-neg: #e66767; --viz-axis: #3A4C5A;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0E151B; --surface: #15202A; --ink: #E6EDF2; --muted: #9AABB8; --rule: #263644; --line: #587082;
  --accent: #5AA2F0; --accent-ink: #0A1722; --accent-soft: #16304A;
  --pos: #4CC38A; --warn: #F0C04F; --warn-fill: #E3B04B; --warn-soft: #33290F; --neg: #F28B80; --neg-soft: #3A1B19;
  --viz-income: #3987e5; --viz-spend: #d95926; --viz-budget: #199e70; --viz-pos: #3987e5; --viz-neg: #e66767; --viz-axis: #3A4C5A;
  color-scheme: dark;
}

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  background: var(--bg);
  color: var(--ink);
  font-family: var(--f-body);
  font-size: 16px;
  line-height: 1.5;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 20px 56px;
}
button, input, select { font: inherit; color: inherit; }
h1, h2, h3, p { margin: 0; }
h1, h2, h3 { font-family: var(--f-display); text-wrap: balance; }
.page { max-width: 880px; margin-inline: auto; min-width: 0; }
.muted { color: var(--muted); }
.num { font-family: var(--f-num); font-variant-numeric: tabular-nums; white-space: nowrap; }
.pos { color: var(--pos); }
.neg { color: var(--neg); }

/* header */
.top { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; flex-wrap: wrap; }
.top h1 { font-size: 28px; line-height: 1.15; font-weight: 700; letter-spacing: -0.01em; }
.today { font-family: var(--f-num); font-size: 13px; color: var(--muted); margin-top: 4px; }
.sync { display: inline-flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 600; color: var(--muted); border: 1px solid var(--rule); background: var(--surface); border-radius: 999px; padding: 4px 12px; }
.sync::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--line); }
.sync[data-mode="cloud"]::before { background: var(--pos); }
.sync[data-mode="local"]::before { background: var(--warn-fill); }

/* tabs */
.tabs { display: flex; gap: 2px; margin-top: 18px; border-bottom: 1px solid var(--line); overflow-x: auto; }
.tabs button { background: none; border: 0; border-bottom: 3px solid transparent; margin-bottom: -1px; padding: 10px 14px; min-height: 46px; font-weight: 600; font-size: 15px; color: var(--muted); cursor: pointer; white-space: nowrap; }
.tabs button[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--accent); }
.tabs button:focus-visible, .btn:focus-visible, .row:focus-visible, .budget:focus-visible, .link:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.status { margin-top: 12px; }
.status.show { padding: 10px 14px; border-radius: 8px; background: var(--accent-soft); font-weight: 600; font-size: 15px; }
.status.show.error { background: var(--neg-soft); color: var(--neg); }

main { display: block; margin-top: 20px; outline: none; min-width: 0; }
.stack { display: grid; gap: 24px; min-width: 0; }

/* blocks */
.card { background: var(--surface); border: 1px solid var(--rule); border-radius: 10px; padding: 16px; min-width: 0; }
.eyebrow { font-size: 12px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
.section-head { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 12px; }
.section-head h2 { font-size: 22px; font-weight: 700; }
.notice { background: var(--warn-soft); color: var(--ink); border: 1px solid var(--warn-fill); border-radius: 8px; padding: 12px 14px; font-size: 15px; }

/* statement */
.statement dl { margin: 12px 0 0; display: grid; gap: 10px; }
.line { display: flex; align-items: baseline; gap: 12px; }
.line dt { display: flex; flex: 1; align-items: baseline; gap: 8px; min-width: 0; font-weight: 500; }
.line dt::after { content: ""; flex: 1; min-width: 12px; border-bottom: 2px dotted var(--rule); transform: translateY(-4px); }
.line dt small { font-size: 12px; color: var(--muted); font-weight: 400; }
.line dd { margin: 0; font-size: 18px; font-weight: 600; }
.line.total { margin-top: 4px; padding-top: 10px; border-top: 1px solid var(--ink); }
.line.total dt { font-weight: 700; }
.line.total dd { font-size: 22px; border-bottom: 4px double var(--ink); padding-bottom: 2px; }

/* buttons */
.btn { min-height: 44px; padding: 0 18px; border-radius: 8px; font-weight: 600; font-size: 15px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); cursor: pointer; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.danger { color: var(--neg); border-color: var(--neg); }
.btn.small { min-height: 36px; padding: 0 12px; font-size: 14px; }
.btn[disabled] { opacity: 0.5; cursor: not-allowed; }
.btn-row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.link { background: none; border: 0; padding: 0; color: var(--accent); font-weight: 600; text-decoration: underline; cursor: pointer; }

/* lists */
.list { background: var(--surface); border: 1px solid var(--rule); border-radius: 10px; overflow: hidden; }
.day { display: flex; justify-content: space-between; gap: 12px; padding: 8px 16px; background: var(--bg); border-top: 1px solid var(--rule); font-size: 12px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); }
.day:first-child { border-top: 0; }
.row { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 16px; align-items: center; width: 100%; text-align: left; background: none; border: 0; border-top: 1px solid var(--rule); padding: 12px 16px; min-height: 58px; cursor: pointer; }
.day + .row { border-top: 0; }
.row:hover { background: var(--accent-soft); }
.r-main { display: grid; gap: 2px; min-width: 0; }
.r-title { font-weight: 600; overflow-wrap: anywhere; }
.r-meta { font-size: 14px; color: var(--muted); overflow-wrap: anywhere; }
.r-amt { font-weight: 600; font-size: 16px; }
.chip { display: inline-block; font-size: 12px; font-weight: 600; padding: 1px 8px; border: 1px solid var(--line); border-radius: 999px; color: var(--muted); margin-left: 6px; vertical-align: 1px; }
.filters { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 12px; }
.filters select { flex: 1 1 160px; }
.sum-line { display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-bottom: 8px; font-size: 14px; color: var(--muted); }
.sum-line .num { color: var(--ink); font-weight: 600; font-size: 15px; }
.empty { text-align: left; }
.empty h3 { font-size: 20px; margin-bottom: 6px; }
.empty p { margin-bottom: 12px; color: var(--muted); max-width: 60ch; }

/* budgets */
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 300px), 1fr)); gap: 12px; }
.budget { display: grid; gap: 8px; text-align: left; width: 100%; cursor: pointer; background: var(--surface); }
.budget:hover { border-color: var(--accent); }
.b-top { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.b-name { font-family: var(--f-display); font-weight: 700; font-size: 18px; overflow-wrap: anywhere; }
.b-range { font-size: 13px; color: var(--muted); margin-top: -4px; }
.bar { height: 10px; background: var(--rule); border-radius: 5px; overflow: hidden; }
.bar > i { display: block; height: 100%; background: var(--accent); border-radius: 5px; }
.budget.warn .bar > i { background: var(--warn-fill); }
.budget.over .bar > i { background: var(--neg); }
.b-nums { display: flex; justify-content: space-between; gap: 8px; flex-wrap: wrap; font-size: 14px; }
.b-status { font-weight: 600; }
.budget.warn .b-status { color: var(--warn); }
.budget.over .b-status { color: var(--neg); }
@media (prefers-reduced-motion: no-preference) { .bar > i { transition: width 0.4s ease; } }

/* categories */
.cats { list-style: none; margin: 0; padding: 0; display: grid; gap: 14px; }
.cats li { display: grid; gap: 6px; }
.cat-top { display: flex; justify-content: space-between; gap: 12px; }
.cat-top span:first-child { font-weight: 600; overflow-wrap: anywhere; }

/* onboarding */
.steps { margin: 12px 0 0; padding: 0; list-style: none; display: grid; gap: 10px; counter-reset: step; }
.steps li { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; justify-content: space-between; padding: 10px 0; border-top: 1px solid var(--rule); }
.steps li span { flex: 1 1 220px; }

/* settings */
.settings { display: grid; gap: 16px; }
.settings h3 { font-size: 18px; margin-bottom: 6px; }
.settings p { color: var(--muted); font-size: 15px; margin-bottom: 12px; max-width: 64ch; }

/* forms */
.editor-bar { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 16px; }
.editor-bar h2 { font-size: 24px; font-weight: 700; }
.form-card { padding: 20px 16px; }
.field { display: grid; gap: 6px; margin-bottom: 16px; min-width: 0; }
.field label { font-weight: 600; font-size: 14px; }
input[type="text"], input[type="email"], input[type="password"], input[type="date"], input[type="file"], select { width: 100%; min-width: 0; min-height: 46px; padding: 10px 12px; font-size: 16px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); color: var(--ink); }
input[type="file"] { padding: 8px; }
input:focus-visible, select:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
.err { color: var(--neg); font-size: 14px; font-weight: 600; min-height: 0; }
.hint { font-size: 14px; color: var(--muted); margin-bottom: 16px; }
.prompt { margin-bottom: 16px; padding: 16px; border: 2px solid var(--warn-fill); background: var(--warn-soft); border-radius: 10px; display: grid; gap: 10px; }
.prompt strong { font-family: var(--f-display); font-size: 18px; }

/* charts */
.chart { display: grid; gap: 0; }
.chart-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; flex-wrap: wrap; }
.chart h3 { font-size: 18px; font-weight: 700; }
.chart-sub { font-size: 14px; color: var(--muted); margin-top: 2px; overflow-wrap: anywhere; max-width: 60ch; }
.tog-group, .seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; max-width: 100%; }
.tog, .seg button { min-height: 36px; padding: 0 12px; background: var(--surface); border: 0; font-weight: 600; font-size: 13px; cursor: pointer; color: var(--muted); }
.tog + .tog, .seg button + button { border-left: 1px solid var(--line); }
.tog[aria-pressed="true"], .seg button[aria-pressed="true"] { background: var(--accent-soft); color: var(--ink); }
.tog:focus-visible, .seg button:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
.legend { display: flex; gap: 6px 16px; flex-wrap: wrap; margin: 12px 0 8px; font-size: 13px; color: var(--ink); }
.lg { display: inline-flex; align-items: center; gap: 6px; }
.lg-key { display: inline-block; flex: none; }
.lg-key.rect { width: 12px; height: 12px; border-radius: 3px; }
.lg-key.line { width: 16px; height: 0; border-top: 3px solid; border-radius: 2px; }
.k-income { background: var(--viz-income); border-color: var(--viz-income); }
.k-spend { background: var(--viz-spend); border-color: var(--viz-spend); }
.k-budget { background: var(--viz-budget); border-color: var(--viz-budget); }
.k-pos { background: var(--viz-pos); border-color: var(--viz-pos); }
.k-neg { background: var(--viz-neg); border-color: var(--viz-neg); }
.unit { margin-left: auto; color: var(--muted); }
.chart-host { position: relative; min-width: 0; }
.plot { display: block; max-width: 100%; overflow: visible; outline: none; touch-action: pan-y; }
.plot:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }
.plot .grid { stroke: var(--rule); stroke-width: 1; }
.plot .axisline { stroke: var(--viz-axis); stroke-width: 1; }
.plot .cross { stroke: var(--viz-axis); stroke-width: 1; }
.plot .tick { fill: var(--muted); font: 11px var(--f-body); font-variant-numeric: tabular-nums; }
.plot .xl { fill: var(--muted); font: 12px var(--f-body); }
.plot .lbl { fill: var(--ink); font: 600 12px var(--f-body); paint-order: stroke; stroke: var(--surface); stroke-width: 4px; stroke-linejoin: round; }
.plot .hit { fill: transparent; }
.plot .m-income { fill: var(--viz-income); }
.plot .m-spend { fill: var(--viz-spend); }
.plot .n-pos { fill: var(--viz-pos); }
.plot .n-neg { fill: var(--viz-neg); }
.plot .ln { fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.plot .ln-spend { stroke: var(--viz-spend); }
.plot .ln-budget { stroke: var(--viz-budget); }
.plot .ln-income { stroke: var(--viz-income); }
.plot .wash { fill: var(--viz-spend); opacity: 0.1; }
.plot .dot-spend { fill: var(--viz-spend); stroke: var(--surface); stroke-width: 2; }
.tip { position: absolute; top: 0; z-index: 3; pointer-events: none; min-width: 160px; max-width: 260px; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; font-size: 13px; box-shadow: 0 4px 14px rgba(0, 0, 0, 0.16); }
.tip-t { font-size: 12px; font-weight: 600; color: var(--muted); margin-bottom: 4px; }
.tip-row { display: flex; align-items: center; gap: 8px; padding: 1px 0; }
.tip-l { flex: 1; color: var(--muted); }
.tip-v { font-weight: 700; color: var(--ink); }
.tbl-wrap { overflow-x: auto; margin-top: 8px; }
.tbl { border-collapse: collapse; width: 100%; font-size: 14px; }
.tbl caption { text-align: left; font-size: 13px; color: var(--muted); padding: 4px 0 8px; }
.tbl th, .tbl td { padding: 8px 10px; border-top: 1px solid var(--rule); text-align: right; white-space: nowrap; font-weight: 500; }
.tbl thead th { font-size: 12px; text-transform: uppercase; letter-spacing: 0.05em; color: var(--muted); font-weight: 700; }
.tbl th:first-child { text-align: left; }
.tbl tbody th { font-weight: 600; }
.trend-stack { display: grid; gap: 16px; }

/* statement: two "left" lines */
.line.sub-total { margin-top: 0; padding-top: 0; border-top: 0; }
.line.sub-total dd { font-size: 20px; border-bottom: 0; }
.line .na { color: var(--muted); font-weight: 500; font-size: 15px; }

/* category tree */
.tree { padding: 0; overflow: hidden; }
.tree-head, .t-row { display: grid; grid-template-columns: minmax(0, 1fr) repeat(3, minmax(64px, 112px)); gap: 4px 12px; align-items: center; }
.tree-head { padding: 10px 16px; background: var(--bg); border-bottom: 1px solid var(--rule); font-size: 12px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); }
.tree-head span:not(:first-child), .t-row .num { text-align: right; }
.tree details > summary { list-style: none; cursor: pointer; }
.tree details > summary::-webkit-details-marker { display: none; }
.tree summary:focus-visible, .t-leaf:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
.t-row { padding: 10px 16px; border-top: 1px solid var(--rule); min-height: 52px; }
.tree > details:first-of-type > summary .t-row { border-top: 0; }
.t-row:hover { background: var(--accent-soft); }
.t-name { display: grid; gap: 4px; min-width: 0; }
.t-title { display: flex; align-items: center; gap: 8px; font-weight: 600; min-width: 0; }
.t-title > span:last-child { overflow-wrap: anywhere; }
.caret { flex: none; width: 18px; height: 18px; display: inline-grid; place-items: center; color: var(--muted); transition: transform 0.15s ease; }
details[open] > summary .caret { transform: rotate(90deg); }
.t-meta { font-size: 13px; color: var(--muted); overflow-wrap: anywhere; }
.t-bar { height: 6px; background: var(--rule); border-radius: 3px; overflow: hidden; max-width: 320px; }
.t-bar > i { display: block; height: 100%; background: var(--accent); border-radius: 3px; }
.t-bar.warn > i { background: var(--warn-fill); }
.t-bar.over > i { background: var(--neg); }
.t-cat > summary .t-title { font-family: var(--f-display); font-size: 17px; font-weight: 700; }
.t-sub .t-row { padding-left: 42px; background: color-mix(in srgb, var(--bg) 45%, var(--surface)); }
.t-sub .t-row:hover { background: var(--accent-soft); }
.t-leaf { display: grid; grid-template-columns: minmax(0, 1fr) repeat(3, minmax(64px, 112px)); gap: 4px 12px; align-items: center; width: 100%; text-align: left; background: none; border: 0; border-top: 1px dashed var(--rule); padding: 9px 16px 9px 68px; min-height: 44px; cursor: pointer; font-size: 15px; }
.t-cat > .t-leaf { padding-left: 42px; }
.t-leaf:hover { background: var(--accent-soft); }
.t-leaf .num { text-align: right; color: var(--muted); }
.t-leaf .when { color: var(--muted); font-size: 13px; margin-right: 8px; font-family: var(--f-num); }
.t-foot { padding: 12px 16px; border-top: 1px solid var(--ink); font-weight: 700; }
.t-none { color: var(--muted); font-weight: 500; }
@media (max-width: 560px) {
  .tree-head, .t-row, .t-leaf { grid-template-columns: minmax(0, 1fr) repeat(2, auto); }
  .tree-head .c-budget, .t-row .c-budget, .t-leaf .c-budget { display: none; }
  .t-sub .t-row { padding-left: 28px; }
  .t-leaf { padding-left: 44px; }
}
@media (prefers-reduced-motion: reduce) { .caret { transition: none; } }
.cat-group { display: grid; gap: 10px; }
.cat-group + .cat-group { margin-top: 20px; }
.cat-group-head { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; flex-wrap: wrap; padding-bottom: 6px; border-bottom: 1px solid var(--line); }
.cat-group-head h3 { font-size: 19px; }
.cat-group-head .muted { font-size: 14px; }

/* sign-in, lock */
.gate { max-width: 440px; margin: 8px auto 0; }
.gate .card { padding: 24px 20px; }
.gate h2 { font-size: 24px; font-weight: 700; margin-bottom: 6px; }
.gate .lead { color: var(--muted); margin-bottom: 18px; }
.gate .btn { width: 100%; }
.gate .btn + .btn { margin-top: 10px; }
.gate .alt { margin-top: 18px; display: grid; gap: 10px; justify-items: start; font-size: 15px; }
.form-msg { margin-bottom: 14px; padding: 10px 12px; border-radius: 8px; font-size: 15px; font-weight: 600; background: var(--neg-soft); color: var(--neg); }
.form-msg.ok { background: var(--accent-soft); color: var(--ink); }
.pw-wrap { position: relative; }
.pw-wrap input { padding-right: 72px; }
.pw-wrap .link { position: absolute; right: 12px; top: 50%; transform: translateY(-50%); font-size: 14px; }
.lock-icon { width: 56px; height: 56px; border-radius: 14px; background: var(--accent-soft); color: var(--accent); display: grid; place-items: center; margin-bottom: 14px; }
.check { display: flex; gap: 10px; align-items: center; font-weight: 600; margin-bottom: 12px; }
.check input { width: 22px; height: 22px; accent-color: var(--accent); }
.acct { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }
.acct strong { overflow-wrap: anywhere; }
.export-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 300px), 1fr)); gap: 12px; }
.export-item { display: grid; grid-template-rows: auto 1fr auto; gap: 6px; }
.export-item .btn { justify-self: start; min-width: 180px; }
.export-item h3 { font-size: 17px; margin: 0; }
.export-item p { color: var(--muted); font-size: 14px; margin: 0 0 6px; }
.range-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 180px), 1fr)); gap: 0 12px; }

/* loading */
.loading { display: grid; gap: 12px; }
.sk { height: 14px; border-radius: 7px; background: var(--rule); }
.w90 { width: 90%; } .w60 { width: 60%; } .w40 { width: 40%; }
@media (prefers-reduced-motion: no-preference) { .sk { animation: pulse 1.4s ease-in-out infinite; } }
@keyframes pulse { 50% { opacity: 0.45; } }
</style>
</head>
<body>
<div class="page">
  <header class="top">
    <div>
      <h1>Household Cashbook</h1>
      <p class="today" id="today"></p>
    </div>
    <span class="sync" id="sync" data-mode="pending">Connecting…</span>
  </header>
  <nav class="tabs" role="tablist" aria-label="Sections">
    <button type="button" role="tab" data-tab="overview" aria-selected="true">Overview</button>
    <button type="button" role="tab" data-tab="journal" aria-selected="false">Expenses</button>
    <button type="button" role="tab" data-tab="income" aria-selected="false">Income</button>
    <button type="button" role="tab" data-tab="budgets" aria-selected="false">Budgets</button>
    <button type="button" role="tab" data-tab="export" aria-selected="false">Export</button>
    <button type="button" role="tab" data-tab="settings" aria-selected="false">Settings</button>
  </nav>
  <div id="status" class="status" role="status" aria-live="polite"></div>
  <main id="main" role="tabpanel" tabindex="-1"></main>
</div>
<noscript>This app needs JavaScript.</noscript>
<script src="firebase-config.js"></script>

<script>
(function () {
  'use strict';

  /* ---------- constants ---------- */
  const DEFAULT_CATS = ['Food', 'Transport', 'Housing', 'Utilities', 'Health', 'Education', 'Entertainment', 'Shopping', 'Other'];
  const PERIODS = [['daily', 'Daily'], ['weekly', 'Weekly'], ['monthly', 'Monthly'], ['quarterly', 'Quarterly'], ['yearly', 'Yearly']];
  const FREQS = [['once', 'One-time'], ['weekly', 'Weekly'], ['monthly', 'Monthly'], ['quarterly', 'Quarterly'], ['yearly', 'Yearly']];
  const FREQ_FACTOR = { once: 1, weekly: 52 / 12, monthly: 1, quarterly: 1 / 3, yearly: 1 / 12 };
  const PERIOD_TITLE = { daily: 'Daily', weekly: 'Weekly', monthly: 'Monthly', quarterly: 'Quarterly', yearly: 'Yearly' };
  const FREQ_TITLE = { once: 'One-time', weekly: 'Weekly', monthly: 'Monthly', quarterly: 'Quarterly', yearly: 'Yearly' };
  const CURRENCIES = ['USD', 'CDF', 'EUR', 'GBP', 'ZAR', 'KES', 'UGX', 'RWF', 'XAF', 'NGN', 'GHS', 'MAD'];
  const NO_DECIMALS = ['CDF', 'UGX', 'RWF', 'XAF'];
  const EXAMPLE_SCALE = { CDF: 2500, UGX: 3700, RWF: 1400, XAF: 600, NGN: 1500, KES: 130, ZAR: 18, GHS: 12, MAD: 10 };
  const LS_KEY = 'household-cashbook.v1';
  const NEW_CAT = '__new__';

  /* ---------- state ---------- */
  let docs = new Map();
  let mode = 'pending';   // 'pending' | 'cloud' | 'local'
  let ready = false;
  let col = null;
  let dl = null;
  let currency = 'USD';
  let lsOk = true;
  let lsWarned = false;
  let toastTimer = null;
  const ui = { tab: 'overview', editor: null, jPeriod: 'month', jCat: '', trendMonths: 6, xPeriod: 'month', xFrom: '', xTo: '', treeOpen: new Set() };

  // account + lock state
  const FB = window.CASHBOOK_FIREBASE || {};
  const cloudConfigured = !!(FB.apiKey && FB.projectId && FB.appId);
  let gate = 'boot';          // 'boot' | 'signin' | 'signup' | 'reset' | 'lock' | 'offer' | 'app'
  let gateMsg = null;         // { text, ok }
  let auth = null, db = null, user = null, unsub = null;
  let syncState = 'ok';       // 'ok' | 'pending' | 'offline'
  let hiddenAt = 0;
  let unlockBusy = false;
  const LOCK_PREFIX = 'cashbook.lock.';
  const fmts = {};

  const $ = (id) => document.getElementById(id);

  /* ---------- tiny DOM helper ---------- */
  function h(tag, attrs, ...kids) {
    const el = document.createElement(tag);
    let value;
    if (attrs) {
      for (const k in attrs) {
        const v = attrs[k];
        if (v == null || v === false) continue;
        if (k === 'class') el.className = v;
        else if (k === 'style') Object.assign(el.style, v);
        else if (k === 'value') value = v;
        else if (k.startsWith('on')) el.addEventListener(k.slice(2), v);
        else el.setAttribute(k, v === true ? '' : v);
      }
    }
    for (const kid of kids.flat(Infinity)) {
      if (kid == null || kid === false) continue;
      el.append(kid.nodeType ? kid : document.createTextNode(String(kid)));
    }
    if (value !== undefined) el.value = value;
    return el;
  }

  /* ---------- dates, money ---------- */
  const pad = (n) => String(n).padStart(2, '0');
  const iso = (d) => d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
  const parseISO = (s) => { const p = s.split('-').map(Number); return new Date(p[0], p[1] - 1, p[2]); };
  const todayISO = () => iso(new Date());
  const isISO = (s) => typeof s === 'string' && /^\d{4}-\d{2}-\d{2}$/.test(s);
  const fmtDate = (s) => parseISO(s).toLocaleDateString(undefined, { day: 'numeric', month: 'short', year: 'numeric' });

  function periodRange(period, ref) {
    const y = ref.getFullYear(), m = ref.getMonth(), d = ref.getDate();
    let s, e;
    if (period === 'daily') { s = new Date(y, m, d); e = new Date(y, m, d + 1); }
    else if (period === 'weekly') { const dow = (ref.getDay() + 6) % 7; s = new Date(y, m, d - dow); e = new Date(y, m, d - dow + 7); }
    else if (period === 'quarterly') { const qm = Math.floor(m / 3) * 3; s = new Date(y, qm, 1); e = new Date(y, qm + 3, 1); }
    else if (period === 'yearly') { s = new Date(y, 0, 1); e = new Date(y + 1, 0, 1); }
    else { s = new Date(y, m, 1); e = new Date(y, m + 1, 1); }
    return { start: iso(s), end: iso(e), startDate: s, endDate: new Date(e.getFullYear(), e.getMonth(), e.getDate() - 1) };
  }
  const inR = (date, r) => date >= r.start && date < r.end;

  function rangeLabel(period, r) {
    const f = (d, o) => d.toLocaleDateString(undefined, o);
    if (period === 'daily') return f(r.startDate, { weekday: 'long', day: 'numeric', month: 'long' });
    if (period === 'monthly') return f(r.startDate, { month: 'long', year: 'numeric' });
    if (period === 'quarterly') return 'Q' + (Math.floor(r.startDate.getMonth() / 3) + 1) + ' ' + r.startDate.getFullYear() + ' · ' + f(r.startDate, { month: 'short' }) + ' to ' + f(r.endDate, { month: 'short' });
    if (period === 'yearly') return String(r.startDate.getFullYear());
    return f(r.startDate, { day: 'numeric', month: 'short' }) + ' to ' + f(r.endDate, { day: 'numeric', month: 'short' });
  }

  function money(n) {
    if (!fmts[currency]) {
      try {
        fmts[currency] = new Intl.NumberFormat(undefined, Object.assign({ style: 'currency', currency: currency }, NO_DECIMALS.includes(currency) ? { minimumFractionDigits: 0, maximumFractionDigits: 0 } : {}));
      } catch (e) { fmts[currency] = { format: (v) => currency + ' ' + v.toFixed(2) }; }
    }
    return fmts[currency].format(n);
  }

  function parseAmount(s) {
    let t = String(s == null ? '' : s).trim().replace(/\s/g, '');
    if (!t) return null;
    if (t.includes(',') && t.includes('.')) t = t.replace(/,/g, ''); else t = t.replace(',', '.');
    const n = Number(t);
    return isFinite(n) ? n : null;
  }

  const sum = (arr) => arr.reduce((t, x) => t + x.amount, 0);
  const uid = (p) => p + '_' + Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
  const errMsg = (e) => (e && e.message) ? e.message : '';

  /* ---------- storage ---------- */
  function lsLoad() {
    try {
      const raw = localStorage.getItem(LS_KEY);
      if (raw) { const o = JSON.parse(raw); return new Map(Object.entries(o.docs || {})); }
    } catch (e) { lsOk = false; }
    return new Map();
  }
  function lsSave() {
    try { localStorage.setItem(LS_KEY, JSON.stringify({ docs: Object.fromEntries(docs) })); } catch (e) { lsOk = false; }
    if (!lsOk && !lsWarned) { lsWarned = true; toast('This browser blocked storage. Entries will be lost when you close the page. Export a backup in Settings.', 'error'); }
  }

  function onData() {
    const s = docs.get('settings');
    currency = (s && s.currency) || 'USD';
    renderHeader();
    if (!ui.editor && gate === 'app') renderMain();
  }

  const MIME = { csv: 'text/csv', json: 'application/json', pdf: 'application/pdf', xlsx: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' };
  async function deviceSave(o) {
    const ext = (o.filename.split('.').pop() || '').toLowerCase();
    const type = MIME[ext] || 'application/octet-stream';
    const blob = o.data instanceof Blob ? o.data : new Blob([o.data], { type: type });
    const file = new File([blob], o.filename, { type: type });
    if (navigator.canShare && navigator.canShare({ files: [file] })) {
      try { await navigator.share({ files: [file], title: o.filename }); return { status: 'saved' }; }
      catch (e) { if (e && e.name === 'AbortError') throw { code: 'declined' }; }
    }
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = o.filename;
    document.body.append(a); a.click(); a.remove();
    setTimeout(function () { URL.revokeObjectURL(url); }, 10000);
    return { status: 'saved' };
  }

  function loadScript(src) {
    return new Promise(function (resolve, reject) {
      const s = document.createElement('script');
      s.src = src; s.async = true;
      s.onload = resolve;
      s.onerror = function () { reject(new Error('Could not load ' + src)); };
      document.head.append(s);
    });
  }

  async function initStore() {
    dl = { save: deviceSave };
    try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch (e) { /* optional */ }
    if ('serviceWorker' in navigator && location.protocol === 'https:') {
      navigator.serviceWorker.register('sw.js').catch(function () { /* offline cache is optional */ });
    }
    if (!cloudConfigured) {
      mode = 'local'; docs = lsLoad(); ready = true;
      setGate(lockEnabled() ? 'lock' : 'app');
      onData();
      return;
    }
    try {
      await loadScript('lib-firebase.js');
      firebase.initializeApp(FB);
      auth = firebase.auth();
      db = firebase.firestore();
      try { await db.enablePersistence({ synchronizeTabs: true }); } catch (e) { /* offline cache unavailable; still works online */ }
    } catch (e) {
      // SDK could not load (first launch while offline): fall back to the device copy
      mode = 'local'; docs = lsLoad(); ready = true; setGate('app'); onData();
      toast('Could not reach your account. Showing entries stored on this device.', 'error');
      return;
    }
    auth.onAuthStateChanged(function (u) {
      if (unsub) { unsub(); unsub = null; }
      user = u;
      if (!u) {
        mode = 'pending'; ready = false; docs = new Map();
        if (gate !== 'signup' && gate !== 'reset') setGate('signin');
        return;
      }
      startCloud(u);
    });
  }

  function startCloud(u) {
    mode = 'cloud'; ready = false;
    col = db.collection('users').doc(u.uid).collection('docs');
    const firstSignIn = gate === 'signin' || gate === 'signup';
    if (lockEnabled() && !firstSignIn) setGate('lock');
    else if (firstSignIn && lockAvailableCache !== false && !lockEnabled() && !lockDeclined()) setGate('offer');
    else setGate('app');
    migrateLocal(u).catch(function () { /* reported inside */ });
    unsub = col.onSnapshot({ includeMetadataChanges: true }, function (snap) {
      syncState = snap.metadata.hasPendingWrites ? 'pending' : snap.metadata.fromCache ? 'offline' : 'ok';
      const changed = !ready || snap.docChanges().length > 0;
      if (changed) {
        const m = new Map();
        snap.forEach(function (d) { m.set(d.id, d.data()); });
        docs = m; ready = true; onData();
      } else { renderHeader(); }
    }, function (e) {
      toast('Could not load your entries. ' + errMsg(e), 'error');
    });
  }

  // Entries saved on this device before the account existed are copied into the account once.
  async function migrateLocal(u) {
    const flag = 'household-cashbook.migrated.' + u.uid;
    let local;
    try { if (localStorage.getItem(flag)) return; local = lsLoad(); } catch (e) { return; }
    const ids = Array.from(local.keys()).filter(function (id) { return validDoc(id, local.get(id)); });
    if (!ids.length) { try { localStorage.setItem(flag, '1'); } catch (e) { /* ignore */ } return; }
    for (let i = 0; i < ids.length; i += 400) {
      const batch = db.batch();
      ids.slice(i, i + 400).forEach(function (id) {
        batch.set(col.doc(id), local.get(id));
      });
      await batch.commit();
    }
    try {
      localStorage.setItem(LS_KEY + '.before-account', localStorage.getItem(LS_KEY) || '');
      localStorage.removeItem(LS_KEY);
      localStorage.setItem(flag, '1');
    } catch (e) { /* ignore */ }
    toast(ids.length + (ids.length === 1 ? ' entry' : ' entries') + ' from this iPad copied to your account');
  }

  // Firestore applies writes to its local cache at once and syncs when online,
  // so the app does not wait for the server (that would hang while offline).
  function putDoc(id, data) {
    if (mode === 'cloud') {
      return new Promise(function (resolve) {
        col.doc(id).set(data).catch(function (e) { toast('Could not save. ' + errMsg(e), 'error'); });
        resolve();
      });
    }
    docs = new Map(docs); docs.set(id, data); onData(); lsSave();
    return Promise.resolve();
  }
  function deleteDoc(id) {
    if (mode === 'cloud') {
      return new Promise(function (resolve) {
        col.doc(id).delete().catch(function (e) { toast('Could not delete. ' + errMsg(e), 'error'); });
        resolve();
      });
    }
    docs = new Map(docs); docs.delete(id); onData(); lsSave();
    return Promise.resolve();
  }

  function listKind(kind) {
    const out = [];
    docs.forEach(function (d, id) { if (d && d.kind === kind) out.push(Object.assign({ id: id }, d)); });
    return out;
  }
  const byDateDesc = (a, b) => (a.date < b.date ? 1 : a.date > b.date ? -1 : (b.created || 0) - (a.created || 0));

  function categories() {
    const seen = new Map();
    DEFAULT_CATS.forEach((c) => seen.set(c.toLowerCase(), c));
    docs.forEach(function (d) {
      if (d && (d.kind === 'expense' || d.kind === 'budget') && d.category && d.category !== 'All') {
        const k = d.category.toLowerCase();
        if (!seen.has(k)) seen.set(k, d.category);
      }
    });
    return Array.from(seen.values());
  }

  /* ---------- feedback ---------- */
  function toast(msg, kind) {
    const el = $('status');
    el.textContent = msg;
    el.className = 'status show ' + (kind || '');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { el.className = 'status'; el.textContent = ''; }, 5000);
  }

  /* ---------- chrome ---------- */
  function renderHeader() {
    $('today').textContent = new Date().toLocaleDateString(undefined, { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });
    const chip = $('sync');
    const inApp = gate === 'app';
    chip.hidden = !inApp;
    document.querySelector('.tabs').hidden = !inApp;
    if (mode === 'cloud') {
      chip.dataset.mode = syncState === 'ok' ? 'cloud' : 'local';
      chip.textContent = syncState === 'ok' ? 'Synced to your account' : syncState === 'pending' ? 'Saving to your account…' : 'Offline · will sync later';
    } else {
      chip.dataset.mode = mode;
      chip.textContent = mode === 'local' ? 'Stored on this device' : 'Connecting…';
    }
  }

  function setGate(g, msg) {
    gate = g; gateMsg = msg || null;
    if (g !== 'app') ui.editor = null;
    renderHeader();
    renderMain();
    if (g === 'lock') autoUnlock();
  }

  function updateTabs() {
    document.querySelectorAll('.tabs button').forEach(function (b) {
      b.setAttribute('aria-selected', b.dataset.tab === ui.tab ? 'true' : 'false');
    });
  }

  function go(tab) {
    guarded(function () { ui.tab = tab; renderMain(); window.scrollTo(0, 0); });
  }

  function renderMain() {
    const main = $('main');
    main.replaceChildren();
    updateTabs();
    if (gate !== 'app' && gate !== 'boot') { main.append(viewGate()); return; }
    if (!ready || gate === 'boot') { main.append(loadingView()); return; }
    const views = { overview: viewOverview, journal: viewJournal, income: viewIncome, budgets: viewBudgets, export: viewExport, settings: viewSettings };
    main.append(views[ui.tab]());
  }

  function loadingView() {
    return h('div', { class: 'card loading' },
      h('div', { class: 'sk w60' }), h('div', { class: 'sk w90' }), h('div', { class: 'sk w40' }),
      h('p', { class: 'muted' }, 'Opening your cashbook…'));
  }

  /* ---------- shared view pieces ---------- */
  const low = (s) => String(s || '').trim().toLowerCase();
  const subOf = (d) => (d && typeof d.sub === 'string' ? d.sub.trim() : '');
  const SEP = ' › ';
  const catPath = (d, sep) => (d.category || 'Other') + (subOf(d) ? (sep || SEP) + subOf(d) : '');
  const budgetName = (b) => b.category === 'All' ? 'All spending' : catPath(b);

  function subcategories(cat) {
    const seen = new Map(), k = low(cat);
    docs.forEach(function (d) {
      if (d && (d.kind === 'expense' || d.kind === 'budget') && low(d.category) === k && subOf(d)) {
        const s = subOf(d);
        if (!seen.has(low(s))) seen.set(low(s), s);
      }
    });
    return Array.from(seen.values()).sort((a, b) => a.localeCompare(b));
  }

  function budgetMatches(b, e) {
    if (low(b.category || 'All') === 'all') return true;
    if (low(e.category) !== low(b.category)) return false;
    return !subOf(b) || low(subOf(e)) === low(subOf(b));
  }

  function budgetStats(b, exp) {
    const r = periodRange(b.period, new Date());
    const spent = exp.filter((e) => inR(e.date, r) && budgetMatches(b, e)).reduce((t, e) => t + e.amount, 0);
    const ratio = b.amount > 0 ? spent / b.amount : 0;
    return { r: r, spent: spent, ratio: ratio, left: b.amount - spent };
  }

  // a budget's limit expressed for one calendar month
  function perMonth(b, mr) {
    const days = mr.endDate.getDate();
    const f = { daily: days, weekly: days / 7, monthly: 1, quarterly: 1 / 3, yearly: 1 / 12 }[b.period] || 1;
    return b.amount * f;
  }

  // Budget for the month: the "All spending" budget if there is one, otherwise the category budgets added up
  function monthBudget(bud, mr) {
    const all = bud.filter((b) => b.category === 'All');
    if (all.length) {
      const b = all.find((x) => x.period === 'monthly') || all[0];
      return { amount: perMonth(b, mr), note: b.period === 'monthly' ? 'All spending' : 'All spending, ' + (PERIOD_TITLE[b.period] || '').toLowerCase() + ' × month' };
    }
    const cats = new Map();
    bud.forEach(function (b) { const k = low(b.category); if (!cats.has(k)) cats.set(k, []); cats.get(k).push(b); });
    let t = 0;
    cats.forEach(function (list) { t += catBudgetAmount(list, mr); });
    return cats.size ? { amount: t, note: 'sum of category budgets' } : null;
  }
  // a category's monthly budget: its own budget(s) if set, otherwise the sum of its sub-category budgets
  function catBudgetAmount(list, mr) {
    const own = list.filter((b) => !subOf(b));
    return (own.length ? own : list).reduce((t, b) => t + perMonth(b, mr), 0);
  }

  function budgetCard(b, exp) {
    const s = budgetStats(b, exp);
    const name = budgetName(b);
    const state = s.ratio >= 1 ? ' over' : s.ratio >= 0.8 ? ' warn' : '';
    const pct = Math.min(100, Math.round(s.ratio * 100));
    const status = s.left >= 0 ? money(s.left) + ' left · ' + Math.round(s.ratio * 100) + '% used' : 'Over by ' + money(-s.left);
    return h('button', { type: 'button', class: 'card budget' + state, onclick: function () { openEditor('budget', b.id); } },
      h('div', { class: 'b-top' }, h('span', { class: 'b-name' }, name), h('span', { class: 'chip' }, PERIOD_TITLE[b.period] || b.period)),
      h('div', { class: 'b-range' }, rangeLabel(b.period, s.r)),
      h('div', { class: 'bar', role: 'progressbar', 'aria-label': name + ' budget', 'aria-valuemin': '0', 'aria-valuemax': '100', 'aria-valuenow': String(pct) },
        h('i', { style: { width: pct + '%' } })),
      h('div', { class: 'b-nums' }, h('span', { class: 'num' }, money(s.spent) + ' of ' + money(b.amount)), h('span', { class: 'b-status' }, status)));
  }

  function line(label, note, value, cls, total) {
    return h('div', { class: 'line' + (total ? ' total' : '') },
      h('dt', null, label, note ? h('small', null, note) : null),
      h('dd', { class: 'num ' + (cls || '') }, value));
  }

  function incomeForRange(inc, r) {
    return inc.reduce(function (t, i) {
      if (i.frequency === 'once') return inR(i.date, r) ? t + i.amount : t;
      return i.date < r.end ? t + i.amount * (FREQ_FACTOR[i.frequency] || 1) : t;
    }, 0);
  }

  function localNotice() {
    return h('div', { class: 'notice' },
      h('strong', null, 'Storage is blocked. '),
      'This browser is not letting the app save entries, so they will be lost when you close it. Open the app from your Home Screen icon, or check Safari privacy settings.');
  }

  /* ---------- charts ---------- */
  const SVGNS = 'http://www.w3.org/2000/svg';
  function S(tag, attrs, ...kids) {
    const el = document.createElementNS(SVGNS, tag);
    if (attrs) { for (const k in attrs) { const v = attrs[k]; if (v == null || v === false) continue; el.setAttribute(k, v); } }
    for (const kid of kids.flat(Infinity)) {
      if (kid == null || kid === false) continue;
      el.append(kid.nodeType ? kid : document.createTextNode(String(kid)));
    }
    return el;
  }

  let compactFmt = null;
  function compact(n) {
    try {
      compactFmt = compactFmt || new Intl.NumberFormat(undefined, { notation: 'compact', maximumFractionDigits: 1 });
      return compactFmt.format(n);
    } catch (e) { return String(Math.round(n)); }
  }

  function niceTicks(min, max, count) {
    if (!(max > min)) max = min + 1;
    const raw = (max - min) / count;
    const mag = Math.pow(10, Math.floor(Math.log10(raw)));
    const norm = raw / mag;
    const step = (norm <= 1 ? 1 : norm <= 2 ? 2 : norm <= 2.5 ? 2.5 : norm <= 5 ? 5 : 10) * mag;
    const lo = Math.floor(min / step) * step;
    const hi = Math.ceil(max / step) * step;
    const ticks = [];
    for (let v = lo; v <= hi + step / 2; v += step) ticks.push(+v.toFixed(10));
    return { ticks: ticks, lo: lo, hi: hi };
  }

  const PM = { l: 46, r: 12, t: 14, b: 28 };
  function makePlot(width, height, vmin, vmax, label) {
    const nt = niceTicks(Math.min(0, vmin), vmax, 4);
    const x0 = PM.l, x1 = width - PM.r, yTop = PM.t, yBot = height - PM.b;
    const y = function (v) { return yBot - (v - nt.lo) / (nt.hi - nt.lo) * (yBot - yTop); };
    const svg = S('svg', { viewBox: '0 0 ' + width + ' ' + height, width: width, height: height, role: 'img', tabindex: '0', class: 'plot', 'aria-label': label });
    nt.ticks.forEach(function (t) {
      svg.append(S('line', { x1: x0, x2: x1, y1: y(t), y2: y(t), class: t === 0 ? 'axisline' : 'grid' }));
      svg.append(S('text', { x: x0 - 8, y: y(t) + 4, 'text-anchor': 'end', class: 'tick' }, compact(t)));
    });
    return { svg: svg, x0: x0, x1: x1, yTop: yTop, yBot: yBot, y: y };
  }

  // a column anchored on the baseline, 4px rounded at the data end
  function colPath(x, base, w, hgt, up, r) {
    if (!(hgt > 0.5)) return '';
    r = Math.min(r, w / 2, hgt);
    const e = up ? base - hgt : base + hgt;
    const k = up ? r : -r;
    return 'M' + x + ' ' + base + 'V' + (e + k) + 'Q' + x + ' ' + e + ' ' + (x + r) + ' ' + e + 'H' + (x + w - r) + 'Q' + (x + w) + ' ' + e + ' ' + (x + w) + ' ' + (e + k) + 'V' + base + 'Z';
  }

  function tipFor(host) {
    const tip = h('div', { class: 'tip', hidden: true });
    host.append(tip);
    return {
      show: function (cx, title, rows) {
        const kids = rows.map(function (r) {
          return h('div', { class: 'tip-row' }, r.key ? h('i', { class: 'lg-key ' + r.key }) : null, h('span', { class: 'tip-l' }, r.label), h('span', { class: 'num tip-v' }, r.value));
        });
        tip.replaceChildren.apply(tip, [h('div', { class: 'tip-t' }, title)].concat(kids));
        tip.hidden = false;
        const w = tip.offsetWidth;
        tip.style.left = Math.max(0, Math.min(host.clientWidth - w, cx - w / 2)) + 'px';
      },
      hide: function () { tip.hidden = true; }
    };
  }

  function wireHover(svg, count, idxFromX, show, hide) {
    let active = -1;
    const at = function (ev) {
      const i = idxFromX(ev.clientX - svg.getBoundingClientRect().left);
      if (i < 0) { active = -1; hide(); } else if (i !== active) { active = i; show(i); }
    };
    svg.addEventListener('pointermove', at);
    svg.addEventListener('pointerdown', at);
    svg.addEventListener('pointerleave', function (ev) { if (ev.pointerType === 'mouse') { active = -1; hide(); } });
    svg.addEventListener('keydown', function (ev) {
      if (ev.key !== 'ArrowLeft' && ev.key !== 'ArrowRight') return;
      ev.preventDefault();
      active = active < 0 ? count - 1 : Math.max(0, Math.min(count - 1, active + (ev.key === 'ArrowRight' ? 1 : -1)));
      show(active);
    });
    svg.addEventListener('blur', function () { active = -1; hide(); });
  }

  function buildTable(t) {
    return h('table', { class: 'tbl' },
      h('caption', null, t.caption),
      h('thead', null, h('tr', null, t.head.map(function (x) { return h('th', { scope: 'col' }, x); }))),
      h('tbody', null, t.rows.map(function (r) {
        return h('tr', null, r.map(function (c, i) { return i === 0 ? h('th', { scope: 'row' }, c) : h('td', { class: 'num' }, c); }));
      })));
  }

  // cfg: { title, sub, legend:[{kind,cls,label}], draw(host,width), table:{caption,head,rows} }
  function chartCard(cfg) {
    const host = h('div', { class: 'chart-host' });
    const tblWrap = h('div', { class: 'tbl-wrap', hidden: true }, buildTable(cfg.table));
    const bChart = h('button', { type: 'button', class: 'tog', 'aria-pressed': 'true' }, 'Chart');
    const bTable = h('button', { type: 'button', class: 'tog', 'aria-pressed': 'false' }, 'Table');
    let lastW = 0;
    function redraw() {
      const w = Math.floor(host.clientWidth);
      if (w < 120 || host.hidden) return;
      lastW = w;
      host.replaceChildren();
      cfg.draw(host, w);
    }
    function setView(table) {
      host.hidden = table; tblWrap.hidden = !table;
      bChart.setAttribute('aria-pressed', String(!table));
      bTable.setAttribute('aria-pressed', String(table));
      if (!table) redraw();
    }
    bChart.addEventListener('click', function () { setView(false); });
    bTable.addEventListener('click', function () { setView(true); });
    if (window.ResizeObserver) {
      new ResizeObserver(function () { if (Math.floor(host.clientWidth) !== lastW) redraw(); }).observe(host);
    } else { window.addEventListener('resize', redraw); }
    requestAnimationFrame(redraw);
    return h('section', { class: 'card chart' },
      h('div', { class: 'chart-head' },
        h('div', null, h('h3', null, cfg.title), h('p', { class: 'chart-sub' }, cfg.sub)),
        h('div', { class: 'tog-group' }, bChart, bTable)),
      h('div', { class: 'legend' }, cfg.legend.map(function (it) {
        return h('span', { class: 'lg' }, h('i', { class: 'lg-key ' + it.kind + ' ' + it.cls }), it.label);
      }), h('span', { class: 'unit' }, currency)),
      host, tblWrap);
  }

  function allBudget(bud) { return bud.find(function (b) { return b.category === 'All' && b.period === 'monthly'; }) || null; }

  function monthSeries(n, inc, exp) {
    const out = [], now = new Date();
    for (let k = n - 1; k >= 0; k--) {
      const ref = new Date(now.getFullYear(), now.getMonth() - k, 1);
      const r = periodRange('monthly', ref);
      const income = incomeForRange(inc, r);
      const spent = sum(exp.filter(function (e) { return inR(e.date, r); }));
      out.push({ income: income, spent: spent, net: income - spent,
        label: ref.toLocaleDateString(undefined, { month: 'short' }),
        full: ref.toLocaleDateString(undefined, { month: 'long', year: 'numeric' }) });
    }
    let first = out.findIndex(function (m) { return m.income > 0 || m.spent > 0; });
    if (first < 0) first = out.length - 1;
    return out.slice(Math.min(first, Math.max(0, out.length - 3)));
  }

  /* chart 1: this month's pace */
  function paceCard(inc, exp, bud, monthIncome) {
    const now = new Date(), mr = periodRange('monthly', now);
    const days = mr.endDate.getDate(), today = now.getDate();
    const perDay = new Array(days).fill(0);
    exp.filter(function (e) { return inR(e.date, mr); }).forEach(function (e) { perDay[parseISO(e.date).getDate() - 1] += e.amount; });
    const cum = []; let t = 0;
    for (let i = 0; i < today; i++) { t += perDay[i]; cum.push(t); }
    const budget = allBudget(bud);
    const kind = budget ? 'budget' : 'income';
    const limit = budget ? budget.amount : (monthIncome > 0 ? monthIncome : 0);
    if (!t && !limit) return null;
    const d = { days: days, today: today, cum: cum, limit: limit, kind: kind, month: mr.startDate.toLocaleDateString(undefined, { month: 'long' }) };
    const paceNow = limit * today / days;
    const sub = 'Day ' + today + ' of ' + days + '. Spent ' + money(t) + (kind === 'budget'
      ? '; an even pace through your ' + money(limit) + ' budget would be ' + money(paceNow) + '.'
      : ' of the ' + money(limit) + ' income counted this month.');
    const rows = cum.map(function (v, i) { return [String(i + 1), money(v), limit ? money(kind === 'budget' ? limit * (i + 1) / days : limit) : '-']; });
    return chartCard({
      title: kind === 'budget' ? 'Spending against your budget' : 'Spending against income',
      sub: sub,
      legend: [{ kind: 'line', cls: 'k-spend', label: 'Spent so far' }].concat(limit ? [kind === 'budget' ? { kind: 'line', cls: 'k-budget', label: 'Budget pace' } : { kind: 'line', cls: 'k-income', label: 'Income this month' }] : []),
      draw: function (host, width) { drawPace(host, width, d); },
      table: { caption: 'Cumulative spending by day, ' + d.month, head: ['Day', 'Spent so far', kind === 'budget' ? 'Budget pace' : 'Income'], rows: rows }
    });
  }

  function drawPace(host, width, d) {
    const N = d.days, last = d.cum.length ? d.cum[d.cum.length - 1] : 0;
    const p = makePlot(width, 230, 0, Math.max(d.limit, last, 1) * 1.08, 'Cumulative spending in ' + d.month + ': ' + money(last) + ' by day ' + d.today + (d.limit ? ', compared with ' + money(d.limit) : ''));
    const xd = function (day) { return p.x0 + (N === 1 ? 0 : (day - 1) / (N - 1) * (p.x1 - p.x0)); };
    const lim = function (day) { return d.kind === 'budget' ? d.limit * day / N : d.limit; };
    const ticks = [];
    for (let k = 1; k <= N; k += 7) ticks.push(k);
    if (N - ticks[ticks.length - 1] >= 3) ticks.push(N);
    ticks.forEach(function (k) { p.svg.append(S('text', { x: xd(k), y: p.yBot + 18, 'text-anchor': 'middle', class: 'xl' }, k)); });

    const cross = S('line', { y1: p.yTop, y2: p.yBot, class: 'cross', visibility: 'hidden' });
    p.svg.append(cross);
    if (d.limit > 0) {
      p.svg.append(S('line', { x1: xd(1), y1: p.y(lim(1)), x2: xd(N), y2: p.y(lim(N)), class: 'ln ' + (d.kind === 'budget' ? 'ln-budget' : 'ln-income') }));
      p.svg.append(S('text', { x: p.x1, y: p.y(lim(N)) - 8, 'text-anchor': 'end', class: 'lbl' }, (d.kind === 'budget' ? 'Budget ' : 'Income ') + money(d.limit)));
    }
    const pts = d.cum.map(function (v, i) { return [xd(i + 1), p.y(v)]; });
    const hot = S('circle', { r: 5, class: 'dot-spend', visibility: 'hidden' });
    if (pts.length) {
      const path = 'M' + pts.map(function (q) { return q[0] + ' ' + q[1]; }).join('L');
      const end = pts[pts.length - 1];
      p.svg.append(S('path', { d: path + 'L' + end[0] + ' ' + p.yBot + 'L' + pts[0][0] + ' ' + p.yBot + 'Z', class: 'wash' }));
      p.svg.append(S('path', { d: path, class: 'ln ln-spend' }));
      p.svg.append(S('circle', { cx: end[0], cy: end[1], r: 5, class: 'dot-spend' }));
      let ly = end[1] - 12, anchor = 'end', lx = end[0] - 8;
      if (end[0] < p.x0 + 110) { anchor = 'start'; lx = end[0] + 8; }
      if (d.limit > 0 && Math.abs(ly - (p.y(lim(N)) - 8)) < 16 && end[0] > p.x1 - 160) ly = end[1] + 22;
      p.svg.append(S('text', { x: lx, y: ly, 'text-anchor': anchor, class: 'lbl' }, money(last)));
    }
    p.svg.append(hot);

    const tip = tipFor(host);
    const hide = function () { cross.setAttribute('visibility', 'hidden'); hot.setAttribute('visibility', 'hidden'); tip.hide(); };
    const show = function (i) {
      const day = i + 1, x = xd(day);
      cross.setAttribute('x1', x); cross.setAttribute('x2', x); cross.setAttribute('visibility', 'visible');
      const rows = [];
      if (day <= d.today) {
        hot.setAttribute('cx', x); hot.setAttribute('cy', p.y(d.cum[i])); hot.setAttribute('visibility', 'visible');
        rows.push({ key: 'line k-spend', label: 'Spent so far', value: money(d.cum[i]) });
      } else { hot.setAttribute('visibility', 'hidden'); }
      if (d.limit > 0) rows.push({ key: 'line ' + (d.kind === 'budget' ? 'k-budget' : 'k-income'), label: d.kind === 'budget' ? 'Budget pace' : 'Income', value: money(lim(day)) });
      if (d.kind === 'budget' && day <= d.today) {
        const diff = d.cum[i] - lim(day);
        rows.push({ label: diff > 0 ? 'Over pace by' : 'Under pace by', value: money(Math.abs(diff)) });
      }
      tip.show(x, d.month + ' ' + day, rows);
    };
    wireHover(p.svg, N, function (px) {
      if (px < p.x0 - 8 || px > p.x1 + 8) return -1;
      return Math.max(0, Math.min(N - 1, Math.round((px - p.x0) / (p.x1 - p.x0) * (N - 1))));
    }, show, hide);
    host.prepend(p.svg);
  }

  /* chart 2: income, spending and budget by month */
  function monthsCard(months, budget) {
    const limit = budget ? budget.amount : 0;
    const m = months[months.length - 1];
    let sub = m.full + ': income ' + money(m.income) + ', spent ' + money(m.spent);
    if (limit) sub += (m.spent > limit ? ', over the ' + money(limit) + ' budget by ' + money(m.spent - limit) : ', within the ' + money(limit) + ' budget');
    sub += '.';
    const d = { months: months, limit: limit };
    return chartCard({
      title: 'Income and spending by month',
      sub: sub,
      legend: [{ kind: 'rect', cls: 'k-income', label: 'Income' }, { kind: 'rect', cls: 'k-spend', label: 'Spending' }].concat(limit ? [{ kind: 'line', cls: 'k-budget', label: 'Monthly budget' }] : []),
      draw: function (host, width) { drawMonths(host, width, d); },
      table: {
        caption: 'Income, spending and budget by month',
        head: ['Month', 'Income', 'Spending', 'Left'].concat(limit ? ['Budget'] : []),
        rows: months.map(function (x) {
          return [x.full, money(x.income), money(x.spent), money(x.net)].concat(limit ? [x.spent > limit ? 'Over by ' + money(x.spent - limit) : 'Within budget'] : []);
        })
      }
    });
  }

  function drawMonths(host, width, d) {
    const ms = d.months, n = ms.length;
    const top = Math.max.apply(null, ms.map(function (x) { return Math.max(x.income, x.spent); }).concat([d.limit || 0, 1]));
    const p = makePlot(width, 250, 0, top * 1.08, 'Income and spending for the last ' + n + ' months');
    const band = (p.x1 - p.x0) / n;
    const bw = Math.max(5, Math.min(24, (band - 12) / 2 - 1));
    const step = band < 30 ? 2 : 1;
    const groups = [];
    ms.forEach(function (x, i) {
      const cx = p.x0 + band * (i + 0.5);
      const bi = S('path', { d: colPath(cx - 1 - bw, p.yBot, bw, p.yBot - p.y(x.income), true, 4), class: 'm-income' });
      const bs = S('path', { d: colPath(cx + 1, p.yBot, bw, p.yBot - p.y(x.spent), true, 4), class: 'm-spend' });
      p.svg.append(bi, bs);
      groups.push([bi, bs]);
      if ((n - 1 - i) % step === 0) p.svg.append(S('text', { x: cx, y: p.yBot + 18, 'text-anchor': 'middle', class: 'xl' }, x.label));
    });
    if (d.limit > 0) {
      p.svg.append(S('line', { x1: p.x0, x2: p.x1, y1: p.y(d.limit), y2: p.y(d.limit), class: 'ln ln-budget' }));
      p.svg.append(S('text', { x: p.x0 + 4, y: p.y(d.limit) - 8, class: 'lbl' }, 'Budget ' + money(d.limit)));
    }
    const tip = tipFor(host);
    const hide = function () { groups.forEach(function (g) { g.forEach(function (b) { b.style.opacity = ''; }); }); tip.hide(); };
    const show = function (i) {
      groups.forEach(function (g, j) { g.forEach(function (b) { b.style.opacity = j === i ? '1' : '0.45'; }); });
      const x = ms[i];
      const rows = [
        { key: 'rect k-income', label: 'Income', value: money(x.income) },
        { key: 'rect k-spend', label: 'Spending', value: money(x.spent) },
        { label: x.net >= 0 ? 'Left over' : 'Overspent by', value: money(Math.abs(x.net)) }
      ];
      if (d.limit > 0) rows.push({ key: 'line k-budget', label: x.spent > d.limit ? 'Over budget by' : 'Under budget by', value: money(Math.abs(x.spent - d.limit)) });
      tip.show(p.x0 + band * (i + 0.5), x.full, rows);
    };
    wireHover(p.svg, n, function (px) {
      const i = Math.floor((px - p.x0) / band);
      return (px < p.x0 || i < 0 || i >= n) ? -1 : i;
    }, show, hide);
    host.prepend(p.svg);
  }

  /* chart 3: what is left each month */
  function netCard(months) {
    const withData = months.filter(function (x) { return x.income > 0 || x.spent > 0; });
    const avg = withData.length ? withData.reduce(function (t, x) { return t + x.net; }, 0) / withData.length : 0;
    const d = { months: months };
    return chartCard({
      title: 'Left over each month',
      sub: 'Income minus spending. On average ' + money(avg) + ' a month over the months shown.',
      legend: [{ kind: 'rect', cls: 'k-pos', label: 'Left over' }, { kind: 'rect', cls: 'k-neg', label: 'Overspent' }],
      draw: function (host, width) { drawNet(host, width, d); },
      table: {
        caption: 'Income minus spending by month',
        head: ['Month', 'Left', 'Result'],
        rows: months.map(function (x) { return [x.full, money(x.net), x.net >= 0 ? 'Left over' : 'Overspent']; })
      }
    });
  }

  function drawNet(host, width, d) {
    const ms = d.months, n = ms.length;
    const vals = ms.map(function (x) { return x.net; }).concat([0]);
    const vmin = Math.min.apply(null, vals), vmax = Math.max.apply(null, vals);
    const pad = (vmax - vmin) * 0.06;
    const p = makePlot(width, 200, vmin < 0 ? vmin - pad : 0, vmax + pad, 'Income minus spending for the last ' + n + ' months');
    const band = (p.x1 - p.x0) / n;
    const bw = Math.max(6, Math.min(24, band - 12));
    const step = band < 30 ? 2 : 1;
    const zero = p.y(0), bars = [];
    ms.forEach(function (x, i) {
      const cx = p.x0 + band * (i + 0.5);
      const up = x.net >= 0;
      const hgt = up ? zero - p.y(x.net) : p.y(x.net) - zero;
      const b = S('path', { d: colPath(cx - bw / 2, zero, bw, hgt, up, 4), class: up ? 'n-pos' : 'n-neg' });
      p.svg.append(b); bars.push(b);
      if ((n - 1 - i) % step === 0) p.svg.append(S('text', { x: cx, y: p.yBot + 18, 'text-anchor': 'middle', class: 'xl' }, x.label));
    });
    const tip = tipFor(host);
    const hide = function () { bars.forEach(function (b) { b.style.opacity = ''; }); tip.hide(); };
    const show = function (i) {
      bars.forEach(function (b, j) { b.style.opacity = j === i ? '1' : '0.45'; });
      const x = ms[i];
      tip.show(p.x0 + band * (i + 0.5), x.full, [
        { key: 'rect ' + (x.net >= 0 ? 'k-pos' : 'k-neg'), label: x.net >= 0 ? 'Left over' : 'Overspent by', value: money(Math.abs(x.net)) },
        { label: 'Income', value: money(x.income) },
        { label: 'Spending', value: money(x.spent) }
      ]);
    };
    wireHover(p.svg, n, function (px) {
      const i = Math.floor((px - p.x0) / band);
      return (px < p.x0 || i < 0 || i >= n) ? -1 : i;
    }, show, hide);
    host.prepend(p.svg);
  }

  function trendsSection(inc, exp, bud) {
    const sec = h('section', null, h('div', { class: 'section-head' }, h('h2', null, 'Trends')));
    if (!inc.length && !exp.length) {
      sec.append(h('div', { class: 'card empty' }, h('p', null, 'Charts appear once you add income or expenses.')));
      return sec;
    }
    const seg = h('div', { class: 'seg', role: 'group', 'aria-label': 'Months shown' }, [3, 6, 12].map(function (n) {
      return h('button', { type: 'button', 'aria-pressed': String(ui.trendMonths === n), onclick: function () { ui.trendMonths = n; renderMain(); } }, 'Last ' + n + ' months');
    }));
    sec.append(h('div', { class: 'filters' }, seg));
    const months = monthSeries(ui.trendMonths, inc, exp);
    sec.append(h('div', { class: 'trend-stack' }, monthsCard(months, allBudget(bud)), netCard(months)));
    return sec;
  }

  /* ---------- Face ID lock (passkey on this device) ---------- */
  // Face ID works in Safari web apps through passkeys (WebAuthn). The passkey lives in the
  // iPad's keychain; Cashbook asks iPadOS to confirm it with Face ID (or the device passcode)
  // before showing your data. Your Firebase sign-in stays active underneath.
  let lockAvailableCache = null;
  function checkLockAvailable() {
    try {
      if (!window.PublicKeyCredential || !PublicKeyCredential.isUserVerifyingPlatformAuthenticatorAvailable) { lockAvailableCache = false; return; }
      PublicKeyCredential.isUserVerifyingPlatformAuthenticatorAvailable()
        .then(function (ok) { lockAvailableCache = !!ok; if (gate === 'app' && ui.tab === 'settings' && !ui.editor) renderMain(); })
        .catch(function () { lockAvailableCache = false; });
    } catch (e) { lockAvailableCache = false; }
  }
  const lockKey = () => LOCK_PREFIX + (user ? user.uid : 'none');
  function lockGet() {
    if (!user) return null;
    try { const o = JSON.parse(localStorage.getItem(lockKey()) || 'null'); return o && o.id ? o : null; } catch (e) { return null; }
  }
  function lockSet(o) { try { if (o) localStorage.setItem(lockKey(), JSON.stringify(o)); else localStorage.removeItem(lockKey()); } catch (e) { /* ignore */ } }
  const lockEnabled = () => !!lockGet();
  function lockDeclined() { try { return !!localStorage.getItem(lockKey() + '.declined'); } catch (e) { return false; } }
  function setLockDeclined() { try { localStorage.setItem(lockKey() + '.declined', '1'); } catch (e) { /* ignore */ } }

  const b64u = (buf) => btoa(String.fromCharCode.apply(null, new Uint8Array(buf))).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
  function unb64u(s) {
    const b = atob(s.replace(/-/g, '+').replace(/_/g, '/') + '==='.slice((s.length + 3) % 4));
    const out = new Uint8Array(b.length);
    for (let i = 0; i < b.length; i++) out[i] = b.charCodeAt(i);
    return out;
  }
  const challenge = () => crypto.getRandomValues(new Uint8Array(32));

  async function enableLock() {
    if (!user) return false;
    const cred = await navigator.credentials.create({ publicKey: {
      challenge: challenge(),
      rp: { name: 'Cashbook', id: location.hostname },
      user: { id: new TextEncoder().encode(user.uid), name: user.email || 'Cashbook', displayName: user.email || 'Cashbook' },
      pubKeyCredParams: [{ type: 'public-key', alg: -7 }, { type: 'public-key', alg: -257 }],
      authenticatorSelection: { authenticatorAttachment: 'platform', userVerification: 'required', residentKey: 'preferred' },
      timeout: 60000,
      attestation: 'none'
    } });
    if (!cred) return false;
    const prev = lockGet();
    lockSet({ id: b64u(cred.rawId), after: prev ? prev.after : 1 });
    return true;
  }

  async function verifyLock() {
    const l = lockGet();

    const cred = await navigator.credentials.get({ publicKey: {
      challenge: challenge(),
      rpId: location.hostname,
      allowCredentials: [{ type: 'public-key', id: unb64u(l.id), transports: ['internal', 'hybrid'] }],
      userVerification: 'required',
      timeout: 60000
    } });
    return !!cred;
  }

  /* ---------- export ---------- */
  const libs = {};
  function ensureLib(name) {

  const XPERIODS = [['month', 'This month'], ['last', 'Last month'], ['quarter', 'This quarter'], ['year', 'This year'], ['lastyear', 'Last year'], ['all', 'All time'], ['custom', 'Choose dates…']];
  const addDays = (s, n) => { const d = parseISO(s); return iso(new Date(d.getFullYear(), d.getMonth(), d.getDate() + n)); };

  function exportRange() {
    const now = new Date();
    let r, label;
    if (ui.xPeriod === 'last') { r = periodRange('monthly', new Date(now.getFullYear(), now.getMonth() - 1, 1)); label = rangeLabel('monthly', r); }
    else if (ui.xPeriod === 'quarter') { r = periodRange('quarterly', now); label = rangeLabel('quarterly', r); }
    else if (ui.xPeriod === 'year') { r = periodRange('yearly', now); label = 'Year ' + rangeLabel('yearly', r); }
    else if (ui.xPeriod === 'lastyear') { r = periodRange('yearly', new Date(now.getFullYear() - 1, 0, 1)); label = 'Year ' + rangeLabel('yearly', r); }
    else if (ui.xPeriod === 'all' || ui.xPeriod === 'custom') {
      let lo = todayISO(), hi = todayISO();
      docs.forEach(function (d) { if (d && d.date && isISO(d.date)) { if (d.date < lo) lo = d.date; if (d.date > hi) hi = d.date; } });
      let s = lo, eIncl = hi;
      if (ui.xPeriod === 'custom') {
        s = isISO(ui.xFrom) ? ui.xFrom : iso(new Date(now.getFullYear(), now.getMonth(), 1));
        eIncl = isISO(ui.xTo) ? ui.xTo : todayISO();
        if (eIncl < s) { const t = s; s = eIncl; eIncl = t; }
      }
      r = { start: s, end: addDays(eIncl, 1), startDate: parseISO(s), endDate: parseISO(eIncl) };
      label = (ui.xPeriod === 'all' ? 'All time · ' : '') + fmtDate(s) + ' to ' + fmtDate(eIncl);
    }
    else { r = periodRange('monthly', now); label = rangeLabel('monthly', r); }
    // never report on months that have not started: recurring income would be counted ahead of time
    const cap = periodRange('monthly', now);
    if (r.end > cap.end) {
      r = { start: r.start < cap.end ? r.start : cap.start, end: cap.end, startDate: r.start < cap.end ? r.startDate : cap.startDate, endDate: cap.endDate };
      label += ' (to date)';
    }
    r.label = label;
    r.lastDay = iso(r.endDate);
    return r;
  }

  const daysBetween = (a, b) => Math.round((parseISO(b) - parseISO(a)) / 86400000);

  function reportData(r) {
    const exp = listKind('expense').filter((e) => inR(e.date, r)).sort((a, b) => (a.date < b.date ? -1 : a.date > b.date ? 1 : (a.created || 0) - (b.created || 0)));
    const incAll = listKind('income');
    const months = [];
    let cur = new Date(r.startDate.getFullYear(), r.startDate.getMonth(), 1);
    while (iso(cur) < r.end) {
      const mr = periodRange('monthly', cur);
      const s = mr.start > r.start ? mr.start : r.start;
      const e = mr.end < r.end ? mr.end : r.end;
      const part = { start: s, end: e };
      const frac = daysBetween(s, e) / daysBetween(mr.start, mr.end);
      let income = 0;
      incAll.forEach(function (i) {
        if (i.frequency === 'once') { if (inR(i.date, part)) income += i.amount; }
        else if (i.date < e) income += i.amount * (FREQ_FACTOR[i.frequency] || 1) * frac;
      });
      const spent = sum(exp.filter((x) => inR(x.date, part)));
      months.push({ label: cur.toLocaleDateString(undefined, { month: 'short', year: '2-digit' }), full: cur.toLocaleDateString(undefined, { month: 'long', year: 'numeric' }), income: income, spent: spent, net: income - spent });
      cur = new Date(cur.getFullYear(), cur.getMonth() + 1, 1);
    }
    const income = months.reduce((t, m) => t + m.income, 0);
    const spent = sum(exp);
    const byCat = new Map();
    exp.forEach(function (e) {
      const k = (e.category || 'Other').toLowerCase();
      const c = byCat.get(k) || { name: e.category || 'Other', total: 0, count: 0, subs: new Map() };
      c.total += e.amount; c.count++; byCat.set(k, c);
      const sk = low(subOf(e)) || '~';
      const sc = c.subs.get(sk) || { name: subOf(e) || '(no sub-category)', total: 0, count: 0 };
      sc.total += e.amount; sc.count++; c.subs.set(sk, sc);
    });
    const cats = Array.from(byCat.values()).sort((a, b) => b.total - a.total);
    // sub-category rows, only for categories that use sub-categories
    cats.forEach(function (c) { c.subList = (c.subs.size > 1 || !c.subs.has('~')) ? Array.from(c.subs.values()).sort((a, b) => b.total - a.total) : []; });
    const incRows = incAll.filter((i) => i.frequency === 'once' ? inR(i.date, r) : i.date < r.end).sort(byDateDesc).reverse()
      .map((i) => ({ i: i, counted: 0 }));
    // amount each income source contributes to the period (same rule as the monthly totals)
    incRows.forEach(function (row) {
      const i = row.i;
      if (i.frequency === 'once') { row.counted = i.amount; return; }
      let t = 0, c = new Date(r.startDate.getFullYear(), r.startDate.getMonth(), 1);
      while (iso(c) < r.end) {
        const mr = periodRange('monthly', c);
        const s = mr.start > r.start ? mr.start : r.start, e = mr.end < r.end ? mr.end : r.end;
        if (i.date < e) t += i.amount * (FREQ_FACTOR[i.frequency] || 1) * daysBetween(s, e) / daysBetween(mr.start, mr.end);
        c = new Date(c.getFullYear(), c.getMonth() + 1, 1);
      }
      row.counted = t;
    });
    const allExp = listKind('expense');
    const budgets = listKind('budget').map(function (b) { const s = budgetStats(b, allExp); return { b: b, s: s }; })
      .sort((a, b) => b.s.ratio - a.s.ratio);
    return { r: r, exp: exp, months: months, income: income, spent: spent, left: income - spent, cats: cats, incRows: incRows, budgets: budgets };
  }

  const fileStamp = (r) => r.start === r.lastDay ? r.start : r.start + '_to_' + r.lastDay;
  const decimals = () => NO_DECIMALS.includes(currency) ? 0 : 2;

  // jsPDF's built-in fonts only cover Western European characters
  function pdfText(s) {
    return String(s == null ? '' : s)
      .replace(/[‘’‚′]/g, "'").replace(/[“”„″]/g, '"')
      .replace(/[–—−]/g, '-').replace(/…/g, '...').replace(/[   ]/g, ' ').replace(/·/g, '-')
      .normalize('NFC').replace(/[^\x09\x0A\x0D\x20-\x7E -ÿ€]/g, '');
  }

  function buildPDF(rd) {
    const J = window.jspdf.jsPDF;
    const doc = new J({ unit: 'pt', format: 'a4' });
    const W = doc.internal.pageSize.getWidth(), H = doc.internal.pageSize.getHeight(), M = 40;
    const nf = new Intl.NumberFormat('en-US', { minimumFractionDigits: decimals(), maximumFractionDigits: decimals() });
    const N = (v) => nf.format(Math.round(v * 100) / 100 || 0);
    const C = { ink: [20, 33, 43], muted: [88, 105, 118], rule: [211, 219, 226], accent: [22, 100, 192], income: [42, 120, 214], spend: [235, 104, 52], pos: [23, 114, 74], neg: [179, 54, 44], soft: [238, 242, 245] };
    const T = (s, x, y, o) => doc.text(pdfText(s), x, y, o);
    let y = M;

    doc.setFont('helvetica', 'bold'); doc.setFontSize(20); doc.setTextColor.apply(doc, C.ink);
    T('Household Cashbook report', M, y + 8);
    doc.setFont('helvetica', 'normal'); doc.setFontSize(10.5); doc.setTextColor.apply(doc, C.muted);
    y += 28;
    T(rd.r.label + '   |   Amounts in ' + currency, M, y);
    y += 14;
    T('Created ' + new Date().toLocaleString(undefined, { dateStyle: 'medium', timeStyle: 'short' }) + (user && user.email ? '   |   ' + user.email : ''), M, y);
    y += 22;

    // summary tiles
    const tiles = [['Income', rd.income, C.income], ['Spending', rd.spent, C.spend], [rd.left >= 0 ? 'Left over' : 'Overspent', Math.abs(rd.left), rd.left >= 0 ? C.pos : C.neg]];
    const tw = (W - 2 * M - 20) / 3;
    tiles.forEach(function (t, i) {
      const x = M + i * (tw + 10);
      doc.setFillColor.apply(doc, C.soft); doc.roundedRect(x, y, tw, 58, 6, 6, 'F');
      doc.setFillColor.apply(doc, t[2]); doc.rect(x, y + 8, 3, 42, 'F');
      doc.setFontSize(9.5); doc.setTextColor.apply(doc, C.muted); T(t[0].toUpperCase(), x + 14, y + 22);
      doc.setFont('helvetica', 'bold'); doc.setFontSize(16); doc.setTextColor.apply(doc, C.ink); T(N(t[1]), x + 14, y + 44);
      doc.setFont('helvetica', 'normal');
    });
    y += 78;

    function heading(text) {
      if (y > H - 120) { doc.addPage(); y = M; }
      doc.setFont('helvetica', 'bold'); doc.setFontSize(13); doc.setTextColor.apply(doc, C.ink);
      T(text, M, y); y += 10;
      doc.setFont('helvetica', 'normal');
    }

    // chart: income and spending by month
    if (rd.months.length >= 2 && (rd.income > 0 || rd.spent > 0)) {
      heading('Income and spending by month');
      const ch = 150, cx0 = M + 44, cx1 = W - M, cy1 = y + 14 + ch, cyTop = y + 14;
      const top = Math.max.apply(null, rd.months.map((m) => Math.max(m.income, m.spent)).concat([1]));
      const nt = niceTicks(0, top * 1.05, 4);
      const yv = (v) => cy1 - (v - nt.lo) / (nt.hi - nt.lo) * (cy1 - cyTop);
      doc.setFontSize(8); doc.setTextColor.apply(doc, C.muted); doc.setLineWidth(0.5);
      nt.ticks.forEach(function (t) {
        doc.setDrawColor.apply(doc, t === 0 ? [139, 155, 168] : C.rule); doc.line(cx0, yv(t), cx1, yv(t));
        T(compact(t), cx0 - 6, yv(t) + 3, { align: 'right' });
      });
      const n = rd.months.length, band = (cx1 - cx0) / n, bw = Math.max(2, Math.min(16, (band - 6) / 2 - 1));
      const every = Math.ceil(n / 12);
      rd.months.forEach(function (m, i) {
        const mx = cx0 + band * (i + 0.5);
        const hi = cy1 - yv(m.income), hs = cy1 - yv(m.spent);
        doc.setFillColor.apply(doc, C.income); if (hi > 0.3) doc.rect(mx - 1 - bw, cy1 - hi, bw, hi, 'F');
        doc.setFillColor.apply(doc, C.spend); if (hs > 0.3) doc.rect(mx + 1, cy1 - hs, bw, hs, 'F');
        if (i % every === 0) T(m.label, mx, cy1 + 12, { align: 'center' });
      });
      y = cy1 + 26;
      [['Income', C.income], ['Spending', C.spend]].forEach(function (l, i) {
        const lx = M + i * 90;
        doc.setFillColor.apply(doc, l[1]); doc.rect(lx, y - 7, 8, 8, 'F');
        doc.setTextColor.apply(doc, C.ink); doc.setFontSize(9); T(l[0], lx + 12, y);
      });
      y += 20;
    }

    // chart: spending by category
    if (rd.cats.length) {
      const shown = rd.cats.slice(0, 8);
      if (y + 30 + shown.length * 20 > H - M) { doc.addPage(); y = M; }
