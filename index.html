  function buildXLSX(rd) {
    const X = window.XLSX;
    const wb = X.utils.book_new();
    const numZ = decimals() ? '#,##0.00' : '#,##0';
    const serial = (s) => { const p = s.split('-').map(Number); return (Date.UTC(p[0], p[1] - 1, p[2]) - Date.UTC(1899, 11, 30)) / 86400000; };
    function sheet(name, rows, opts) {
      const ws = X.utils.aoa_to_sheet(rows);
      const ref = X.utils.decode_range(ws['!ref']);
      for (let R = (opts.from || 1); R <= ref.e.r; R++) {
        (opts.money || []).forEach(function (c) { const cell = ws[X.utils.encode_cell({ r: R, c: c })]; if (cell && cell.t === 'n') cell.z = numZ; });
        (opts.dates || []).forEach(function (c) { const cell = ws[X.utils.encode_cell({ r: R, c: c })]; if (cell && cell.t === 'n') cell.z = 'dd mmm yyyy'; });
        (opts.pct || []).forEach(function (c) { const cell = ws[X.utils.encode_cell({ r: R, c: c })]; if (cell && cell.t === 'n') cell.z = '0%'; });
      }
      ws['!cols'] = opts.widths.map((w) => ({ wch: w }));
      if (opts.filter && rows.length > 1) ws['!autofilter'] = { ref: X.utils.encode_range({ s: { r: 0, c: 0 }, e: { r: rows.length - 1, c: rows[0].length - 1 } }) };
      X.utils.book_append_sheet(wb, ws, name);
    }
    const cur = ' (' + currency + ')';
    sheet('Summary', [
      ['Household Cashbook report'], ['Period', rd.r.label], ['From', serial(rd.r.start)], ['To', serial(rd.r.lastDay)], ['Currency', currency],
      ['Created', new Date().toLocaleString()], [],
      ['Income' + cur, rd.income], ['Spending' + cur, rd.spent], ['Left' + cur, rd.left], ['Expense entries', rd.exp.length]
    ], { from: 2, money: [1], dates: [], widths: [22, 34] });
    const ws0 = wb.Sheets.Summary; ['B3', 'B4'].forEach(function (a) { ws0[a].z = 'dd mmm yyyy'; }); ws0.B11.z = '0';
    sheet('Monthly', [['Month', 'Income' + cur, 'Spending' + cur, 'Left' + cur]].concat(rd.months.map((m) => [m.full, m.income, m.spent, m.net])),
      { money: [1, 2, 3], widths: [20, 16, 16, 16] });
    const catRows = [['Category', 'Sub-category', 'Entries', 'Amount' + cur, 'Share']];
    rd.cats.forEach(function (c) {
      catRows.push([c.name, c.subList.length ? 'All' : '', c.count, c.total, rd.spent ? c.total / rd.spent : 0]);
      c.subList.forEach((s) => catRows.push([c.name, s.name, s.count, s.total, rd.spent ? s.total / rd.spent : 0]));
    });
    sheet('Categories', catRows, { money: [3], pct: [4], widths: [20, 20, 10, 16, 10], filter: true });
    sheet('Expenses', [['Date', 'Description', 'Category', 'Sub-category', 'Amount' + cur, 'Note']].concat(rd.exp.map((e) => [serial(e.date), e.title, e.category, subOf(e), e.amount, e.note || ''])),
      { dates: [0], money: [4], widths: [13, 30, 16, 18, 16, 36], filter: true });
    sheet('Income', [['Date', 'Source', 'How often', 'Amount' + cur, 'Counted in period' + cur]].concat(rd.incRows.map((x) => [serial(x.i.date), x.i.title, FREQ_TITLE[x.i.frequency] || x.i.frequency, x.i.amount, x.counted])),
      { dates: [0], money: [3, 4], widths: [13, 26, 12, 16, 24], filter: true });
    sheet('Budgets', [['Budget', 'Period', 'Current period', 'Limit' + cur, 'Spent' + cur, 'Left' + cur, 'Used']].concat(rd.budgets.map((x) => [
      x.b.category === 'All' ? 'All spending' : catPath(x.b, ' / '), PERIOD_TITLE[x.b.period] || x.b.period, rangeLabel(x.b.period, x.s.r), x.b.amount, x.s.spent, x.s.left, x.s.ratio])),
      { money: [3, 4, 5], pct: [6], widths: [18, 11, 26, 14, 14, 14, 8] });
    const out = X.write(wb, { bookType: 'xlsx', type: 'array', compression: true });
    return new Blob([out], { type: MIME.xlsx });
  }

  async function runExport(kind, btn) {
    const r = exportRange();
    const label = btn.textContent;
    btn.disabled = true;
    try {
      if (kind === 'pdf' || kind === 'xlsx') {
        if (!window[kind === 'pdf' ? 'jspdf' : 'XLSX']) { btn.textContent = 'Preparing…'; await ensureLib(kind); }
        const rd = reportData(r);
        const blob = kind === 'pdf' ? buildPDF(rd) : buildXLSX(rd);
        await saveFile('cashbook-report-' + fileStamp(r) + '.' + kind, blob);
      } else if (kind === 'csv-exp') {
        const rows = [['Date', 'Description', 'Category', 'Sub-category', 'Amount (' + currency + ')', 'Note']];
        listKind('expense').filter((e) => inR(e.date, r)).sort(byDateDesc).forEach((e) => rows.push([e.date, e.title, e.category, subOf(e), e.amount, e.note || '']));
        await saveFile('cashbook-expenses-' + fileStamp(r) + '.csv', toCSV(rows));
      } else if (kind === 'csv-inc') {
        const rows = [['Date', 'Source', 'Frequency', 'Amount (' + currency + ')', 'Counted in period (' + currency + ')']];
        reportData(r).incRows.forEach((x) => rows.push([x.i.date, x.i.title, FREQ_TITLE[x.i.frequency] || x.i.frequency, x.i.amount, Math.round(x.counted * 100) / 100]));
        await saveFile('cashbook-income-' + fileStamp(r) + '.csv', toCSV(rows));
      }
    } catch (e) {
      toast('Could not create the file. ' + (navigator.onLine ? errMsg(e) : 'Connect to the internet once so the export tools can download.'), 'error');
    } finally { btn.disabled = false; btn.textContent = label; }
  }

  /* ---------- category tree: category > sub-category > expenses ---------- */
  function categoryTree(exp, bud, mr) {
    const monthExp = exp.filter((e) => inR(e.date, mr)).sort(byDateDesc);
    const catBud = bud.filter((b) => b.category !== 'All');
    const cats = new Map();
    const node = (k, name) => cats.get(k) || (cats.set(k, { name: name, spent: 0, exp: [], buds: [], subs: new Map() }), cats.get(k));
    const subNode = (c, name) => { const k = low(name); return c.subs.get(k) || (c.subs.set(k, { name: name, spent: 0, exp: [], buds: [] }), c.subs.get(k)); };
    monthExp.forEach(function (e) {
      const c = node(low(e.category || 'Other'), e.category || 'Other');
      c.spent += e.amount;
      if (subOf(e)) { const s = subNode(c, subOf(e)); s.spent += e.amount; s.exp.push(e); } else c.exp.push(e);
    });
    catBud.forEach(function (b) {
      const c = node(low(b.category), b.category);
      c.buds.push(b);
      if (subOf(b)) subNode(c, subOf(b)).buds.push(b);
    });
    const list = Array.from(cats.values()).map(function (c) {
      c.budget = c.buds.length ? catBudgetAmount(c.buds, mr) : null;
      c.subs.forEach(function (s) { s.budget = s.buds.length ? s.buds.reduce((t, b) => t + perMonth(b, mr), 0) : null; });
      return c;
    }).sort((a, b) => (b.spent - a.spent) || ((b.budget || 0) - (a.budget || 0)) || a.name.localeCompare(b.name));

    const sec = h('section', null);
    const allKeys = [];
    list.forEach(function (c) {
      allKeys.push('c:' + low(c.name));
      c.subs.forEach(function (s) { allKeys.push('s:' + low(c.name) + '/' + low(s.name)); });
      if (c.subs.size && c.exp.length) allKeys.push('s:' + low(c.name) + '/~');
    });
    const allOpen = allKeys.length && allKeys.every((k) => ui.treeOpen.has(k));
    sec.append(h('div', { class: 'section-head' }, h('h2', null, 'By category'),
      h('div', { class: 'btn-row' },
        list.length ? h('button', { type: 'button', class: 'btn small', onclick: function () {
          if (allOpen) ui.treeOpen.clear(); else allKeys.forEach((k) => ui.treeOpen.add(k));
          renderMain();
        } }, allOpen ? 'Collapse all' : 'Expand all') : null,
        h('button', { type: 'button', class: 'btn small', onclick: function () { go('budgets'); } }, 'Manage budgets'))));

    if (!list.length) {
      sec.append(h('div', { class: 'card empty' }, h('p', null, 'No expenses or budgets this month yet.'),
        h('div', { class: 'btn-row' },
          h('button', { type: 'button', class: 'btn primary', onclick: function () { openEditor('expense'); } }, 'Add an expense'),
          h('button', { type: 'button', class: 'btn', onclick: function () { openEditor('budget'); } }, 'Set a budget'))));
      return sec;
    }

    const caret = () => h('span', { class: 'caret', 'aria-hidden': 'true' }, S('svg', { width: 12, height: 12, viewBox: '0 0 12 12' }, S('path', { d: 'M4 2l4 4-4 4', fill: 'none', stroke: 'currentColor', 'stroke-width': 2, 'stroke-linecap': 'round', 'stroke-linejoin': 'round' })));
    const budText = (b) => money(b.amount) + ' ' + (PERIOD_TITLE[b.period] || b.period).toLowerCase();

    function row(n, meta, leafCount) {
      const ratio = n.budget ? n.spent / n.budget : 0;
      const st = n.budget ? (ratio >= 1 ? ' over' : ratio >= 0.8 ? ' warn' : '') : '';
      const leftV = n.budget != null ? n.budget - n.spent : null;
      return h('div', { class: 't-row' },
        h('span', { class: 't-name' },
          h('span', { class: 't-title' }, caret(), h('span', null, n.name)),
          meta ? h('span', { class: 't-meta' }, meta) : null,
          n.budget ? h('span', { class: 't-bar' + st, role: 'progressbar', 'aria-label': n.name + ' budget used', 'aria-valuemin': '0', 'aria-valuemax': '100', 'aria-valuenow': String(Math.min(100, Math.round(ratio * 100))) },
            h('i', { style: { width: Math.min(100, Math.max(2, ratio * 100)) + '%' } })) : null),
        h('span', { class: 'num c-budget' }, n.budget != null ? money(n.budget) : h('span', { class: 't-none' }, '–')),
        h('span', { class: 'num' }, money(n.spent)),
        h('span', { class: 'num ' + (leftV != null && leftV < 0 ? 'neg' : '') }, leftV == null ? h('span', { class: 't-none' }, '–') : money(leftV)));
    }
    function leaf(e) {
      return h('button', { type: 'button', class: 't-leaf', onclick: function () { openEditor('expense', e.id); } },
        h('span', null, h('span', { class: 'when' }, parseISO(e.date).toLocaleDateString(undefined, { day: 'numeric', month: 'short' })), e.title, e.note ? h('span', { class: 'muted' }, ' · ' + e.note) : null),
        h('span', { class: 'c-budget' }), h('span', { class: 'num' }, money(e.amount)), h('span'));
    }
    function emptyLeaf() { return h('div', { class: 't-leaf', style: { cursor: 'default' } }, h('span', { class: 'muted' }, 'No expenses this month')); }
    function det(key, cls, summaryRow, kids) {
      const d = h('details', { class: cls, open: ui.treeOpen.has(key) }, h('summary', null, summaryRow), kids);
      d.addEventListener('toggle', function () { if (d.open) ui.treeOpen.add(key); else ui.treeOpen.delete(key); });
      return d;
    }

    const box = h('div', { class: 'card tree', role: 'group', 'aria-label': 'Budget and spending by category this month' },
      h('div', { class: 'tree-head', 'aria-hidden': 'true' }, h('span', null, 'Category'), h('span', { class: 'c-budget' }, 'Budget'), h('span', null, 'Spent'), h('span', null, 'Left')));
    list.forEach(function (c) {
      const own = c.buds.filter((b) => !subOf(b));
      const nExp = c.exp.length + Array.from(c.subs.values()).reduce((t, s) => t + s.exp.length, 0);
      const metaBits = [];
      if (own.length) metaBits.push('Budget ' + own.map(budText).join(' + '));
      else if (c.buds.length) metaBits.push('Budget = sum of sub-categories');
      metaBits.push(nExp + (nExp === 1 ? ' expense' : ' expenses'));
      if (c.subs.size) metaBits.push(c.subs.size + (c.subs.size === 1 ? ' sub-category' : ' sub-categories'));
      const kids = [];
      Array.from(c.subs.values()).sort((a, b) => (b.spent - a.spent) || a.name.localeCompare(b.name)).forEach(function (s) {
        const sm = [];
        if (s.buds.length) sm.push('Budget ' + s.buds.map(budText).join(' + '));
        sm.push(s.exp.length + (s.exp.length === 1 ? ' expense' : ' expenses'));
        kids.push(det('s:' + low(c.name) + '/' + low(s.name), 't-sub', row(s, sm.join(' · ')),
          s.exp.length ? s.exp.map(leaf) : emptyLeaf()));
      });
      if (c.exp.length && c.subs.size) {
        const rest = { name: 'Other ' + c.name.toLowerCase(), spent: sum(c.exp), budget: null };
        kids.push(det('s:' + low(c.name) + '/~', 't-sub', row(rest, 'No sub-category'), c.exp.map(leaf)));
      } else { c.exp.forEach((e) => kids.push(leaf(e))); }
      if (!kids.length) kids.push(emptyLeaf());
      box.append(det('c:' + low(c.name), 't-cat', row(c, metaBits.join(' · ')), kids));
    });
    sec.append(box);
    sec.append(h('p', { class: 'hint', style: { marginTop: '8px' } }, 'Budgets are shown per month: weekly, daily, quarterly and yearly limits are converted. Tap a category to open it, and an expense to edit it.'));
    return sec;
  }

  function onboarding() {

  // reuse the existing spelling of a sub-category ("groceries" -> "Groceries")
  function canonSub(cat, v) {
    const t = String(v || '').trim().replace(/\s+/g, ' ');

    return subcategories(cat).find((x) => low(x) === low(t)) || t;
  }

  function openEditor(kind, id) {
    const existing = id ? docs.get(id) : null;
    const def = EDITORS[kind](existing);
    const ed = { kind: kind, id: id || null, def: def, initial: '', after: null, saving: false, prompt: null, del: null };
    ui.editor = ed;

    const prompt = h('div', { class: 'prompt', role: 'alertdialog', 'aria-labelledby': 'prompt-title', hidden: true },
      h('strong', { id: 'prompt-title' }, 'Save your changes?'),
      h('div', { class: 'muted' }, 'You have unsaved changes to this entry.'),
      h('div', { class: 'btn-row' },
        h('button', { type: 'button', class: 'btn primary', onclick: function () { saveEditor(false); } }, 'Save'),
        h('button', { type: 'button', class: 'btn danger', onclick: discardEditor }, 'Discard changes'),
        h('button', { type: 'button', class: 'btn', onclick: function () { prompt.hidden = true; } }, 'Keep editing')));
    ed.prompt = prompt;

    const delPanel = h('div', { class: 'prompt', role: 'alertdialog', 'aria-labelledby': 'del-title', hidden: true },
      h('strong', { id: 'del-title' }, 'Delete this entry?'),
      h('div', { class: 'muted' }, 'This cannot be undone.'),

        h('button', { type: 'button', class: 'btn', onclick: function () { delPanel.hidden = true; } }, 'Keep it')));
    ed.del = delPanel;

    const discardTop = h('button', { type: 'button', class: 'btn', onclick: requestDiscard }, 'Discard');
    const saveTop = h('button', { type: 'submit', form: 'editor-form', class: 'btn primary' }, 'Save');
    const bottom = h('div', { class: 'btn-row' },
      h('button', { type: 'button', class: 'btn', onclick: requestDiscard }, 'Discard'),
      (def.another && !id) ? h('button', { type: 'button', class: 'btn', onclick: function () { saveEditor(true); } }, 'Save and add another') : null,
      id ? h('button', { type: 'button', class: 'btn danger', onclick: function () { delPanel.hidden = false; delPanel.querySelector('button').focus(); } }, 'Delete') : null,
      h('button', { type: 'submit', form: 'editor-form', class: 'btn primary' }, 'Save'));

    const form = h('form', { id: 'editor-form', novalidate: true, onsubmit: function (ev) { ev.preventDefault(); saveEditor(false); } }, def.fields);

    ed.initial = JSON.stringify(def.read());
    window.scrollTo(0, 0);
    if (def.focus) def.focus.focus();

  const editorChanged = () => ui.editor && JSON.stringify(ui.editor.def.read()) !== ui.editor.initial;

  function guarded(next) {
    if (!ui.editor) { next(); return; }
    if (!editorChanged()) { ui.editor = null; next(); return; }
    ui.editor.after = next;
    ui.editor.prompt.hidden = false;
    ui.editor.prompt.scrollIntoView({ block: 'center' });
    ui.editor.prompt.querySelector('button').focus();
  }

  function closeEditor() {
    const after = ui.editor && ui.editor.after;
    ui.editor = null;
    if (after) after(); else { renderMain(); window.scrollTo(0, 0); }
  }
  function requestDiscard() {
    if (!ui.editor) return;
    if (!editorChanged()) { closeEditor(); return; }
    ui.editor.prompt.hidden = false;
    ui.editor.prompt.scrollIntoView({ block: 'center' });
    ui.editor.prompt.querySelector('button').focus();
  }
  function discardEditor() { closeEditor(); }

  async function saveEditor(another) {
    const ed = ui.editor;
    if (!ed || ed.saving) return;
    document.querySelectorAll('.err').forEach(function (n) { n.textContent = ''; });
    const v = ed.def.read();
    const errs = ed.def.validate(v);
    if (errs) {
      ed.prompt.hidden = true;
      let first = null;
      Object.keys(errs).forEach(function (k) { const n = $(k + '-err'); if (n) n.textContent = errs[k]; if (!first) first = k; });
      const el = first && $(first); if (el) { el.focus(); }
      return;
    }
    ed.saving = true;
    const id = ed.id || uid(ed.kind.charAt(0));
    const doc = ed.def.toDoc(v, ed.id ? docs.get(ed.id) : null);
    try { await putDoc(id, doc); } catch (e) { ed.saving = false; return; }
    ed.saving = false;
    toast(ed.kind === 'expense' ? 'Expense saved' : ed.kind === 'income' ? 'Income saved' : 'Budget saved');
    if (another && ed.kind === 'expense') { ui.editor = null; openEditor('expense'); return; }
    closeEditor();
  }

  async function deleteEntry() {
    const ed = ui.editor;
    if (!ed || !ed.id) return;
    try { await deleteDoc(ed.id); } catch (e) { return; }
    toast('Entry deleted');
    ed.after = null;
    closeEditor();
  }

  /* ---------- examples, export, import ---------- */
  async function addExamples() {
    const scale = EXAMPLE_SCALE[currency] || 1;
    const r = (v) => scale === 1 ? v : Math.round(v * scale);
    const t = new Date();
    const back = (n) => iso(new Date(t.getFullYear(), t.getMonth(), t.getDate() - n));
    const monthStart = iso(new Date(t.getFullYear(), t.getMonth(), 1));
    const items = [
      ['i', { kind: 'income', title: 'Salary', amount: r(1200), date: monthStart, frequency: 'monthly' }],
      ['i', { kind: 'income', title: 'Side job', amount: r(150), date: back(6), frequency: 'once' }],
      ['x', { kind: 'expense', title: 'Market groceries', amount: r(42.5), date: back(0), category: 'Food', note: 'Weekly shop' }],
      ['x', { kind: 'expense', title: 'Taxi to work', amount: r(6), date: back(1), category: 'Transport', note: '' }],
      ['x', { kind: 'expense', title: 'Electricity', amount: r(35), date: back(2), category: 'Utilities', note: 'Monthly bill' }],
      ['x', { kind: 'expense', title: 'Phone airtime', amount: r(10), date: back(3), category: 'Utilities', note: '' }],
      ['x', { kind: 'expense', title: 'Lunch', amount: r(8.5), date: back(4), category: 'Food', note: '' }],
      ['b', { kind: 'budget', category: 'Food', amount: r(300), period: 'monthly' }],
      ['b', { kind: 'budget', category: 'Transport', amount: r(40), period: 'weekly' }],
      ['b', { kind: 'budget', category: 'All', amount: r(800), period: 'monthly' }]
    ];
    try {
      for (const it of items) { await putDoc(uid(it[0]), Object.assign({}, it[1], { example: true, created: Date.now() })); }
      toast('Example entries added');
    } catch (e) { /* putDoc already reported */ }
  }

  async function removeExamples() {
    const ids = [];
    docs.forEach(function (d, id) { if (d && d.example) ids.push(id); });
    try { for (const id of ids) { await deleteDoc(id); } toast('Example entries removed'); } catch (e) { /* reported */ }
  }

  function csvCell(v) {
    let s = String(v == null ? '' : v);
    if (typeof v === 'string' && /^[=+\-@\t\r]/.test(s)) s = "'" + s;
    return /[",\n\r]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
  }
  const toCSV = (rows) => '﻿' + rows.map((r) => r.map(csvCell).join(',')).join('\r\n') + '\r\n';

  async function saveFile(name, data) {
    if (!dl) { toast('File saving is not available in this view.', 'error'); return; }
    try { await dl.save({ filename: name, data: data }); toast('Saved ' + name); }
    catch (e) { if (e && e.code === 'declined') return; toast('Could not save the file.', 'error'); }
  }
  function exportBackup() {
    const out = { app: 'household-cashbook', version: 1, exported: new Date().toISOString(), docs: Object.fromEntries(docs) };
    saveFile('cashbook-backup-' + todayISO() + '.json', JSON.stringify(out, null, 2));
  }

  function validDoc(id, d) {
    if (!/^[A-Za-z0-9_.~:@+-]{1,100}$/.test(id) || !d || typeof d !== 'object') return false;
    if (d.kind === 'settings') return typeof d.currency === 'string' && /^[A-Z]{3}$/.test(d.currency);
    if (!(typeof d.amount === 'number' && isFinite(d.amount) && d.amount > 0)) return false;
    if (d.sub != null && (typeof d.sub !== 'string' || d.sub.length > 60)) return false;
    if (d.kind === 'expense') return isISO(d.date) && typeof d.category === 'string';
    if (d.kind === 'income') return isISO(d.date) && !!FREQ_FACTOR[d.frequency];
    if (d.kind === 'budget') return typeof d.category === 'string' && PERIOD_TITLE[d.period] !== undefined;
    return false;
  }
  async function importBackup(file) {
    try {
      const o = JSON.parse(await file.text());
      const src = o && o.docs && typeof o.docs === 'object' ? o.docs : null;
      if (!src) throw new Error('bad file');
      let n = 0;
      for (const id of Object.keys(src)) {
        const d = src[id];
        if (!validDoc(id, d)) continue;
        await putDoc(id, d); n++;
      }
      toast(n + (n === 1 ? ' entry restored' : ' entries restored'));
    } catch (e) { toast('That file is not a Cashbook backup.', 'error'); }
  }

  /* ---------- boot ---------- */
  document.querySelectorAll('.tabs button').forEach(function (b) {
    b.addEventListener('click', function () { go(b.dataset.tab); });
  });
  document.addEventListener('keydown', function (ev) { if (ev.key === 'Escape' && ui.editor) requestDiscard(); });
  checkLockAvailable();
  renderHeader();
  renderMain();
  initStore();
})();
</script>
</body>
</html>
